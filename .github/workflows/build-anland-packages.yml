name: 构建 Anland 软件包
run-name: Anland 软件包 ${{ github.run_number }}

# 按桌面/WM 分组：一个构建开关 + 发行版目标；all 构建该 WM 的所有已支持目标。
# KDE / GNOME / session / Niri Arch 保留固定发布；构建 Artifact 统一只交付原生软件包。
# 原生 ARM64 容器构建，不安装产物、不启动图形会话；一个目标失败不取消其他目标。
on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）构建全部已适配目标。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      # —— KDE Wayland ——
      build_kde:
        description: 构建 Anland KDE Wayland 软件包（kwin + Xwayland）
        required: true
        type: boolean
        default: true
      kde_target:
        description: KDE 构建目标；all 中失败的平台沿用上一份完整发布，单个平台只替换选中的包
        required: true
        type: choice
        default: all
        options:
          - all
          - ubuntu2604
          - Debian13
          - Fedora43
          - Fedora44
          - Arch
      kde_repo:
        description: KDE 使用的 Anland 仓库地址
        required: true
        type: string
        default: https://github.com/sjszero/anland.git
      kde_ref:
        description: KDE 使用的 Anland 分支、标签或提交
        required: true
        type: string
        default: legacy
      # —— GNOME Wayland ——
      build_gnome:
        description: 构建 Anland GNOME Wayland 软件包（Mutter + patched Xwayland）
        required: true
        type: boolean
        default: true
      gnome_target:
        description: GNOME 构建目标；all 中失败的平台沿用上一份完整发布，单个平台只替换选中的包
        required: true
        type: choice
        default: all
        options:
          - all
          - Fedora43
          - Fedora44
          - ubuntu2604
          - Debian13
          - Arch
      gnome_repo:
        description: GNOME 使用的 Anland 仓库地址
        required: true
        type: string
        default: https://github.com/sjszero/anland.git
      gnome_ref:
        description: GNOME 使用的 Anland 分支、标签或提交
        required: true
        type: string
        default: legacy
      # —— Anland Next session ——
      build_session:
        description: 构建 Anland Next session 软件包
        required: true
        type: boolean
        default: true
      session_target:
        description: session 构建目标；all 中失败的平台沿用上一份完整发布，单个平台只替换选中的包
        required: true
        type: choice
        default: all
        options:
          - all
          - ubuntu2604
          - debian13
          - fedora43
          - fedora44
          - arch
      session_repo:
        description: session 使用的 Anland Next 源码仓库地址
        required: true
        type: string
        default: https://github.com/SuperTurtleDev/anland.git
      session_ref:
        description: session 使用的 Anland Next 分支、标签或提交
        required: true
        type: string
        default: main
      # —— Anland Niri ——
      build_niri:
        description: 构建 Anland Niri ARM64 软件包（WM + patched Xwayland）
        required: true
        type: boolean
        default: true
      niri_target:
        description: Anland Niri 构建目标；all 构建该 WM 的所有已适配发行版
        required: true
        type: choice
        default: all
        options:
          - all
          - Fedora43
          - Fedora44
          - ubuntu2604
          - Debian13
          - Arch
      niri_repo:
        description: Niri 使用的 Anland 仓库地址
        required: true
        type: string
        default: https://github.com/sjszero/anland.git
      niri_ref:
        description: Niri 使用的 Anland 分支、标签或提交
        required: true
        type: string
        default: legacy
      # —— Anland Mango ——
      build_mango:
        description: 构建 Anland Mango ARM64 软件包（WM + patched Xwayland）
        required: true
        type: boolean
        default: true
      mango_target:
        description: Anland Mango 构建目标；all 构建该 WM 的所有已适配发行版
        required: true
        type: choice
        default: all
        options:
          - all
          - Fedora43
          - Fedora44
          - ubuntu2604
          - Debian13
          - Arch
      # —— Anland Hyprland ——
      build_hyprland:
        description: 构建 Anland Hyprland ARM64 软件包（WM + patched Xwayland）
        required: true
        type: boolean
        default: true
      hyprland_target:
        description: Anland Hyprland 构建目标；all 构建该 WM 的所有已适配发行版
        required: true
        type: choice
        default: all
        options:
          - all
          - Fedora43
          - Fedora44
          - ubuntu2604
          - Debian13
          - Arch
      # —— Anland Denial ——
      build_denial:
        description: 构建 Anland Denial ARM64 软件包（WM + patched Xwayland）
        required: true
        type: boolean
        default: true
      denial_target:
        description: Anland Denial 构建目标；all 构建该 WM 的所有已适配发行版
        required: true
        type: choice
        default: all
        options:
          - all
          - Fedora43
          - Fedora44
          - ubuntu2604
          - Debian13
          - Arch
      wm_repo:
        description: Mango / Hyprland / Denial 使用的 Anland 仓库地址
        required: true
        type: string
        default: https://github.com/sjszero/anland.git
      wm_ref:
        description: Mango / Hyprland / Denial 使用的 Anland 分支、标签或提交
        required: true
        type: string
        default: legacy
      # —— 通用 ——
      publish_cnb:
        description: 同步发布到 CNB 国内镜像
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  select:
    name: 解析本次构建的软件包
    runs-on: ubuntu-26.04
    outputs:
      kde: ${{ steps.select.outputs.kde }}
      gnome: ${{ steps.select.outputs.gnome }}
      session: ${{ steps.select.outputs.session }}
      niri: ${{ steps.select.outputs.niri }}
      niri_targets: ${{ steps.select.outputs.niri_targets }}
      mango: ${{ steps.select.outputs.mango }}
      mango_targets: ${{ steps.select.outputs.mango_targets }}
      hyprland: ${{ steps.select.outputs.hyprland }}
      hyprland_targets: ${{ steps.select.outputs.hyprland_targets }}
      denial: ${{ steps.select.outputs.denial }}
      denial_targets: ${{ steps.select.outputs.denial_targets }}
    steps:
    - name: 按 WM 开关及发行版目标生成矩阵
      id: select
      env:
        EVENT_NAME: ${{ github.event_name }}
        KDE_INPUT: ${{ inputs.build_kde }}
        GNOME_INPUT: ${{ inputs.build_gnome }}
        SESSION_INPUT: ${{ inputs.build_session }}
        NIRI_INPUT: ${{ inputs.build_niri }}
        MANGO_INPUT: ${{ inputs.build_mango }}
        HYPRLAND_INPUT: ${{ inputs.build_hyprland }}
        DENIAL_INPUT: ${{ inputs.build_denial }}
        NIRI_TARGET: ${{ inputs.niri_target || 'all' }}
        MANGO_TARGET: ${{ inputs.mango_target || 'all' }}
        HYPRLAND_TARGET: ${{ inputs.hyprland_target || 'all' }}
        DENIAL_TARGET: ${{ inputs.denial_target || 'all' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_SELECT'
        import json, os
        scheduled = os.environ['EVENT_NAME'] == 'schedule'
        supported = {
            'niri': ['ubuntu2604', 'Debian13', 'Fedora43', 'Fedora44', 'Arch'],
            'mango': ['ubuntu2604', 'Debian13', 'Fedora43', 'Fedora44', 'Arch'],
            'hyprland': ['ubuntu2604', 'Debian13', 'Fedora43', 'Fedora44', 'Arch'],
            'denial': ['ubuntu2604', 'Debian13', 'Fedora43', 'Fedora44', 'Arch'],
        }
        enabled = {wm: scheduled or os.environ.get(wm.upper() + '_INPUT', 'false') == 'true'
                   for wm in ('kde', 'gnome', 'session', *supported)}
        if not any(enabled.values()):
            raise SystemExit('没有选择任何构建目标；请至少打开一个构建开关。')
        outputs = {wm: str(value).lower() for wm, value in enabled.items()}
        for wm, available in supported.items():
            requested = 'all' if scheduled else os.environ.get(wm.upper() + '_TARGET', 'all')
            if requested not in ['all', *available]:
                raise SystemExit(f'不支持的 {wm} 构建目标：{requested}')
            targets = (available if requested == 'all' else [requested]) if enabled[wm] else []
            outputs[wm + '_targets'] = json.dumps(targets, separators=(',', ':'))
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            for name, value in outputs.items():
                print(f'{name}={value}', file=f)
        print('本次构建：', ', '.join(wm for wm, value in enabled.items() if value))
        for wm in supported:
            print(wm + ' 矩阵：', outputs[wm + '_targets'])
        PY_SELECT
  # ==========================================================================
  # Anland Mango（独立 WM job，发行版在内部展开矩阵）
  # ==========================================================================
  prepare-mango:
    name: 解析 Anland Mango 源码版本（各发行版共用同一提交）
    needs: select
    if: ${{ needs.select.outputs.mango == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ needs.select.outputs.mango_targets }}
    steps:
    - name: 要求从 main 分支触发
      shell: bash
      run: |
        if [ "$GITHUB_REF_NAME" != main ]; then
          echo "此工作流必须从 main 分支触发。" >&2
          exit 1
        fi
    - name: 将请求的源解析为单个提交
      id: resolve
      env:
        ANLAND_REPO: ${{ inputs.wm_repo || 'https://github.com/sjszero/anland.git' }}
        ANLAND_REF: ${{ inputs.wm_ref || 'legacy' }}
      shell: bash
      run: |
        set -euo pipefail
        source_dir="$RUNNER_TEMP/anland-mango-source"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
        anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
        git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
        echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
        echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"
  build-mango:
    name: 构建 Mango ${{ matrix.target }} ARM64 软件包
    needs: prepare-mango
    if: ${{ needs.prepare-mango.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-mango.outputs.targets) }}
    env:
      WM: mango
      TARGET: ${{ matrix.target }}
      ANLAND_REPO: ${{ inputs.wm_repo || 'https://github.com/sjszero/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-mango.outputs.anland_commit }}
    steps:
    - name: 检出云编译产物收集脚本
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - name: 解析 WM 发行版目标
      id: target
      shell: bash
      run: |
        set -euo pipefail
        case "$TARGET" in
          Arch) slug=arch; arch=aarch64 ;;
          Fedora43) slug=fedora43; arch=aarch64 ;;
          Fedora44) slug=fedora44; arch=aarch64 ;;
          Debian13) slug=debian13; arch=arm64 ;;
          ubuntu2604) slug=ubuntu2604; arch=arm64 ;;
          *) echo "不支持的构建目标：$TARGET" >&2; exit 1 ;;
        esac
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
    - name: 在 Fedora ARM64 中构建（匹配发行版源码和 ABI）
      if: ${{ matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT -e FEDORA_VERSION \
          -v "$output_dir:/output" "fedora:$FEDORA_VERSION" bash -s <<'FEDORA_BUILD' 2>&1 | tee "$output_dir/build.log"
        set -euo pipefail
        : "${WM:?}" "${ANLAND_REPO:?}" "${ANLAND_COMMIT:?}"
        case "$WM" in denial|gnome|hyprland|mango|niri) ;; *) echo "Unknown WM: $WM" >&2; exit 1 ;; esac
        [[ $(uname -m) == aarch64 && $(id -u) == 0 ]] || { echo 'requires an ARM64 Fedora CI container' >&2; exit 1; }
        source /etc/os-release
        [[ $ID == fedora && $VERSION_ID == "$FEDORA_VERSION" ]] || exit 1
        dnf --setopt=install_weak_deps=False install -y git-core ca-certificates curl sudo \
            python3 util-linux rpm-build rpmdevtools dnf5-plugins tar xz findutils shadow-utils
        useradd -m -s /bin/bash anland
        printf 'anland ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/anland-dnf
        chmod 0440 /etc/sudoers.d/anland-dnf
        source_dir=/home/anland/.cache/anland-source
        mkdir -p "$source_dir"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
        git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
        [[ $(git -C "$source_dir" rev-parse HEAD) == "$ANLAND_COMMIT" ]]
        recipe="$source_dir/producers/$WM/Fedora${FEDORA_VERSION}_v5"
        test -s "$recipe/dependencies.lock"
        for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
        chown -R anland:anland /home/anland
        mkdir -p /output
        output_owner=$(stat -c '%u:%g' /output)
        restore_output_owner() {
            local build_rc=$?
            trap - EXIT
            if ! chown -Rh -- "$output_owner" /output; then
                printf 'Failed to restore output ownership to %s\n' "$output_owner" >&2
                if [[ $build_rc == 0 ]]; then build_rc=1; fi
            fi
            exit "$build_rc"
        }
        trap restore_output_owner EXIT
        chown anland:anland /output
        runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
            ANLAND_INSTALL=0 ANLAND_STAGE=build ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
            ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
            WORKDIR="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5" \
            ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
        cd /output/artifacts
        package_list="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/packages.list"
        checksums="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/SHA256SUMS"
        [[ -s $package_list ]] || package_list=/output/artifacts/packages.list
        [[ -s $checksums ]] || checksums=/output/artifacts/SHA256SUMS
        test -s "$package_list"
        sha256sum -c "$checksums"
        found=()
        while IFS= read -r package; do
            [[ $package == "${package##*/}" && $package == *.rpm && -s $package ]]
            architecture=$(rpm -qp --qf '%{ARCH}' "$package")
            [[ $architecture == aarch64 || $architecture == noarch ]]
            rpm -K "$package"
            found+=("$(rpm -qp --qf '%{NAME}' "$package")")
        done < "$package_list"
        actual=$(printf '%s\n' "${found[@]}" | sort)
        case "$WM" in
            mango) expected=$(printf '%s\n' mango-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            hyprland) expected=$(printf '%s\n' hyprland-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            denial) expected=$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            niri) expected=$(printf '%s\n' niri-anland xwayland-satellite xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            gnome) expected=$(printf '%s\n' mutter mutter-common mutter-devel xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
        esac
        [[ $actual == "$expected" ]] || { printf 'Incomplete Fedora package set:\n%s\nExpected:\n%s\n' "$actual" "$expected" >&2; exit 1; }
        chmod -R a+rX /output/artifacts
        printf 'RUNNER_BUILD_ARTIFACTS_OK WM=%s DISTRO=fedora%s COMMIT=%s\n' "$WM" "$FEDORA_VERSION" "$ANLAND_COMMIT"
        FEDORA_BUILD
      env:
        FEDORA_VERSION: ${{ matrix.target == 'Fedora44' && '44' || '43' }}
    - name: 在 Arch Linux ARM 中构建
      if: ${{ matrix.target == 'Arch' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        # 挂载父目录而不是 ARTIFACTS 本身，允许 build.sh 原子交换产物目录。
        docker run --rm -i \
          --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" \
          ogarcia/archlinux:latest \
          bash -s <<'ANLAND_ARCH_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial) ;; *) echo "未知的 WM：$WM" >&2; exit 1 ;; esac
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed base-devel git ca-certificates sudo \
              python gnupg cmake meson ninja pkgconf patchelf
            # Denial 使用系统原生 Ninja，避开锁定 depot_tools 的旧 Python wrapper。
            # 完整 engine/desktop 依赖由其 build.sh 的 ANLAND_WITH_DEPS=1 安装。
            if [ "$WM" = denial ]; then
              /usr/bin/ninja --version
              python3 --version
            fi
            # 只交付运行时包，避免 Arch 默认 debug 分包混入预期的软件包集合。
            printf '\nOPTIONS=("${OPTIONS[@]/#debug/!debug}")\n' >> /etc/makepkg.conf
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/anland-pacman
            chmod 0440 /etc/sudoers.d/anland-pacman
            if grep -q '^#PACMAN_AUTH=()' /etc/makepkg.conf; then
              sed -i 's/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/' /etc/makepkg.conf
            else
              printf '\nPACMAN_AUTH=(sudo)\n' >> /etc/makepkg.conf
            fi
            chown anland:anland /output

            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            chown -R anland:anland /home/anland
            recipe="$source_dir/producers/$WM/Arch_v5"
            test -f "$recipe/build.sh"
            test -f "$recipe/startup.sh"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            export WM
            su -m -s /bin/bash anland -c '
              export HOME=/home/anland
              export JOBS="$(nproc)" ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0
              export WORKDIR="$HOME/.cache/anland-$WM-arch-v5"
              case "$WM" in
                denial)
                  export ARTIFACTS_DIR=/output/artifacts
                  export ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1
                  bash "$HOME/.cache/anland-source/producers/denial/Arch_v5/build.sh" --noconfirm
                  ;;
                *)
                  export ARTIFACTS=/output/artifacts
                  bash "$HOME/.cache/anland-source/producers/$WM/Arch_v5/build.sh"
                  ;;
              esac
            '

            cd /output/artifacts
            shopt -s nullglob
            packages=(*.pkg.tar.xz *.pkg.tar.zst *.pkg.tar.gz)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              architecture=$(bsdtar -xOf "$package" .PKGINFO | awk '$1 == "arch" {print $3}')
              [[ $architecture == aarch64 || $architecture == any ]]
              found+=("$(LC_ALL=C pacman -Qp "$package" | awk 'NR == 1 {print $1}')")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xorg-xwayland | sort)" ;;
              hyprland) expected="$(printf '%s\n' hyprland-anland hyprpm-anland xorg-xwayland | sort)" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM COMMIT=$ANLAND_COMMIT"
        ANLAND_ARCH_WM_BUILD
    - name: 在 Debian 13 ARM64 中构建
      if: ${{ matrix.target == 'Debian13' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i \
          --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" \
          debian:trixie \
          bash -s <<'ANLAND_DEBIAN_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland) ;; *) echo "未知的 WM：$WM" >&2; exit 1 ;; esac
            export DEBIAN_FRONTEND=noninteractive
            # 仅限制一次性 CI 容器里的依赖安装，禁止 postinst 启动服务。
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod 0755 /usr/sbin/policy-rc.d
            if [ -f /etc/apt/sources.list.d/debian.sources ]; then
              sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
            else
              printf 'deb-src http://deb.debian.org/debian trixie main\n' \
                > /etc/apt/sources.list.d/anland-trixie-source.list
            fi
            # 最小 Debian 镜像尚无 CA 包；APT 使用签名校验，先沿用官方 HTTP 源。
            printf 'deb http://deb.debian.org/debian trixie-backports main\ndeb-src http://deb.debian.org/debian trixie-backports main\n' \
              > /etc/apt/sources.list.d/anland-backports.list
            apt-get update
            apt-get install -y --no-install-recommends \
              git ca-certificates curl build-essential cmake meson ninja-build pkgconf \
              ccache python3 dpkg-dev debhelper fakeroot quilt patch xz-utils zstd \
              unzip gettext file binutils libpipewire-0.3-dev

            useradd -m -s /bin/bash anland
            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            recipe="$source_dir/producers/$WM/Debian13_v5"
            test -s "$recipe/dependencies.lock"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            if [ "$WM" = mango ]; then
              xwayland_version="$(awk '$1 == "deb" && $2 == "xwayland" {print $3}' "$recipe/dependencies.lock")"
            else
              xwayland_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["xwayland"]["version"])' "$recipe/dependencies.lock")"
            fi
            test -n "$xwayland_version"
            # Xwayland 使用两个配方各自的锁定源码，不继承 WM 的私有库环境。
            apt-get build-dep -y --no-install-recommends "xwayland=$xwayland_version"
            case "$WM" in
              mango)
                # wlroots 读取 xwayland.pc；它属于 xwayland 二进制包，
                # apt-get build-dep 只装构建依赖，不会安装该包自身。
                # 此处仅准备 CI 依赖，最终仍由配方编译、打包修补版 Xwayland。
                apt-get install -y --no-install-recommends -t trixie-backports \
                  "xwayland=$xwayland_version" \
                  libinput-dev libudev-dev libseat-dev libdisplay-info-dev libliftoff-dev \
                  libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev glslang-tools \
                  libpcre2-dev libcjson-dev libpango1.0-dev libpixman-1-dev libwayland-dev \
                  libdrm-dev libxkbcommon-dev libffi-dev libexpat1-dev libxml2-dev bison \
                  libxcb1-dev libxcb-render0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
                  libxcb-icccm4-dev libxcb-composite0-dev libxcb-errors-dev libxcb-ewmh-dev \
                  libxcb-res0-dev libxcb-shape0-dev libxcb-shm0-dev xkb-data hwdata wayland-protocols
                # 按锁定源码启用的功能预检系统依赖，避免私有依赖编译后才报遗漏。
                # 新版 Wayland/libdrm/xkbcommon/pixman/protocols 由 bootstrap 提供，
                # 不能在这里用 Debian 的旧版本代替或要求其满足私有版本下限。
                xwayland_upstream="${xwayland_version#*:}"
                system_deps=(
                  libpipewire-0.3 libffi expat libxml-2.0
                  egl 'gbm >= 21.1' glesv2 libudev 'libseat >= 0.2.0' hwdata
                  'libdisplay-info >= 0.2.0' 'libinput >= 1.27.1'
                  libpcre2-8 libcjson pangocairo "xwayland = ${xwayland_upstream%-*}"
                  xcb xcb-composite xcb-ewmh xcb-icccm xcb-render
                  xcb-res 'xcb-xfixes >= 1.15' xcb-randr
                )
                pkg-config --print-errors --exists "${system_deps[@]}"
                for dependency in "${system_deps[@]}"; do
                  printf 'MANGO_SYSTEM_DEP %s: ' "$dependency"
                  pkg-config --modversion "$dependency"
                done
                for tool in bison glslang; do command -v "$tool"; done
                test -s "$(pkg-config --variable=pkgdatadir hwdata)/pnp.ids"
                test -x "$(pkg-config --variable=xwayland xwayland)"
                echo 'MANGO_SYSTEM_BUILD_DEPENDENCIES_OK'
                # Mango 的 ANLAND_WITH_DEPS=1 从 lockfile 构建新版私有图形依赖，
                # 不是 Arch 配方的 pacman 安装开关；不能在干净 Debian worker 上省略。
                ;;
              hyprland)
                python3 -c 'import json, sys; lock=json.load(open(sys.argv[1])); print("\n".join(name + "=" + entry["version"] for name, entry in lock["sources"].items()))' \
                  "$recipe/dependencies.lock" > /home/anland/.cache/hyprland-build-deps.list
                mapfile -t locked_sources < /home/anland/.cache/hyprland-build-deps.list
                test "${#locked_sources[@]}" -eq 5
                apt-get build-dep -y --no-install-recommends -t trixie-backports "${locked_sources[@]}"
                # Hyprgrass/wf-touch 不属于 Debian 源包的 Build-Depends。
                apt-get install -y --no-install-recommends libglm-dev libevdev-dev
                ;;
            esac
            chown -R anland:anland /home/anland
            chown anland:anland /output
            # Debian 入口固定输出到 recipe/artifacts；普通用户编译后再收集。
            runuser -u anland -- env HOME=/home/anland \
              JOBS="$(nproc)" ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-debian13-v5" \
              bash "$recipe/build.sh"

            mkdir -p /output/artifacts
            install -m644 "$recipe/artifacts/"*.deb "$recipe/artifacts/SHA256SUMS" \
              "$recipe/dependencies.lock" /output/artifacts/
            cd /output/artifacts
            sha256sum -c SHA256SUMS
            packages=(*.deb)
            found=()
            for package in "${packages[@]}"; do
              test -s "$package"
              [ "$(dpkg-deb -f "$package" Architecture)" = arm64 ]
              found+=("$(dpkg-deb -f "$package" Package)")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xwayland | sort)" ;;
              hyprland)
                expected="$(python3 -c 'import json, sys; lock=json.load(open(sys.argv[1])); print("\n".join(sorted([*lock["runtime_packages"].values(), "xwayland"])))' "$recipe/dependencies.lock")"
                ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            printf '%s\n' "${packages[@]}" > packages.list
            python3 - <<'PY_BUILD_INPUTS' > build-inputs.json
        import json, os
        print(json.dumps({
            'schema_version': 1, 'repository': os.environ['ANLAND_REPO'],
            'commit': os.environ['ANLAND_COMMIT'],
            'recipe': 'producers/' + os.environ['WM'] + '/Debian13_v5',
            'distribution': 'debian13', 'architecture': 'arm64',
            'install_artifacts': False, 'graphical_test': False,
        }, ensure_ascii=False, indent=2))
        PY_BUILD_INPUTS
            sha256sum "${packages[@]}" packages.list dependencies.lock build-inputs.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM DISTRO=debian13 COMMIT=$ANLAND_COMMIT"
        ANLAND_DEBIAN_WM_BUILD
    - name: 在 Ubuntu 26.04 ARM64 中构建
      if: ${{ matrix.target == 'ubuntu2604' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" ubuntu:26.04 \
          bash -s <<'ANLAND_UBUNTU_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial|niri) ;; *) echo "未知 WM：$WM" >&2; exit 1 ;; esac
            export DEBIAN_FRONTEND=noninteractive
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod 0755 /usr/sbin/policy-rc.d
            test -f /etc/apt/sources.list.d/ubuntu.sources
            sed -i -e 's/^Types: deb$/Types: deb deb-src/' \
              -e 's/^Components:.*/Components: main restricted universe multiverse/' \
              /etc/apt/sources.list.d/ubuntu.sources
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates curl sudo python3 util-linux
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/sed\n' > /etc/sudoers.d/anland-apt
            chmod 0440 /etc/sudoers.d/anland-apt
            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            recipe="$source_dir/producers/$WM/Ubuntu2604_v5"
            test -s "$recipe/dependencies.lock"
            test -s "$recipe/xwayland.lock"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            chown -R anland:anland /home/anland
            chown anland:anland /output
            runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
              ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
              ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-ubuntu2604-v5" \
              ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
            cd /output/artifacts
            shopt -s nullglob
            packages=(*.deb)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              [ "$(dpkg-deb -f "$package" Architecture)" = arm64 ]
              found+=("$(dpkg-deb -f "$package" Package)")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xwayland | sort)" ;;
              hyprland) expected="$(python3 -c 'import json,sys; lock=json.load(open(sys.argv[1])); print("\n".join(sorted([*lock["runtime_packages"].values(),"xwayland"])))' "$recipe/dependencies.lock")" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xwayland | sort)" ;;
              niri) expected="$(printf '%s\n' niri-anland xwayland-satellite xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM DISTRO=ubuntu2604 COMMIT=$ANLAND_COMMIT"
        ANLAND_UBUNTU_WM_BUILD
    - name: 只收集成品原生软件包
      id: package
      env:
        SLUG: ${{ steps.target.outputs.slug }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        python3 scripts/package-artifacts.py collect --target "$TARGET" \
          --destination "$asset_dir" "$output_dir/artifacts"
        echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"
    - name: 上传可下载的完整软件包
      id: upload
      uses: actions/upload-artifact@v6
      with:
        name: anland-mango-package-${{ steps.target.outputs.slug }}
        path: ${{ steps.package.outputs.asset_dir }}/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
    - name: 取回本次上传的完整产物
      uses: actions/download-artifact@v7
      with:
        name: anland-mango-package-${{ steps.target.outputs.slug }}
        path: ${{ runner.temp }}/anland-mango-${{ steps.target.outputs.slug }}-download
    - name: 确认上传后只有目标软件包且字节一致
      env:
        SLUG: ${{ steps.target.outputs.slug }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      shell: bash
      run: |
        set -euo pipefail
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        download_dir="$RUNNER_TEMP/anland-$WM-$SLUG-download"
        python3 scripts/package-artifacts.py verify --target "$TARGET" "$asset_dir" "$download_dir"
        {
          echo "### $WM $TARGET ARM64 构建通过"
          echo "- 来源提交：\`$ANLAND_COMMIT\`"
          echo "- [下载成品软件包]($ARTIFACT_URL)（保存 14 天）"
          echo '- 下载产物仅包含原生软件包，无签名、校验清单、密钥、构建元数据或日志。'
          echo '- 已逐包比对上传后取回的字节；未安装产物、未运行图形测试。'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: 构建失败时在控制台显示日志结尾
      if: ${{ failure() }}
      shell: bash
      run: |
        tail -n 80 "$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET/build.log" || true
  prepare-hyprland:
    name: 解析 Anland Hyprland 源码版本（各发行版共用同一提交）
    needs: select
    if: ${{ needs.select.outputs.hyprland == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ needs.select.outputs.hyprland_targets }}
    steps:
    - name: 要求从 main 分支触发
      shell: bash
      run: |
        if [ "$GITHUB_REF_NAME" != main ]; then
          echo "此工作流必须从 main 分支触发。" >&2
          exit 1
        fi
    - name: 将请求的源解析为单个提交
      id: resolve
      env:
        ANLAND_REPO: ${{ inputs.wm_repo || 'https://github.com/sjszero/anland.git' }}
        ANLAND_REF: ${{ inputs.wm_ref || 'legacy' }}
      shell: bash
      run: |
        set -euo pipefail
        source_dir="$RUNNER_TEMP/anland-hyprland-source"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
        anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
        git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
        echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
        echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"
  build-hyprland:
    name: 构建 Hyprland ${{ matrix.target }} ARM64 软件包
    needs: prepare-hyprland
    if: ${{ needs.prepare-hyprland.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-hyprland.outputs.targets) }}
    env:
      WM: hyprland
      TARGET: ${{ matrix.target }}
      ANLAND_REPO: ${{ inputs.wm_repo || 'https://github.com/sjszero/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-hyprland.outputs.anland_commit }}
    steps:
    - name: 检出云编译产物收集脚本
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - name: 解析 WM 发行版目标
      id: target
      shell: bash
      run: |
        set -euo pipefail
        case "$TARGET" in
          Arch) slug=arch; arch=aarch64 ;;
          Fedora43) slug=fedora43; arch=aarch64 ;;
          Fedora44) slug=fedora44; arch=aarch64 ;;
          Debian13) slug=debian13; arch=arm64 ;;
          ubuntu2604) slug=ubuntu2604; arch=arm64 ;;
          *) echo "不支持的构建目标：$TARGET" >&2; exit 1 ;;
        esac
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
    - name: 在 Fedora ARM64 中构建（匹配发行版源码和 ABI）
      if: ${{ matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT -e FEDORA_VERSION \
          -v "$output_dir:/output" "fedora:$FEDORA_VERSION" bash -s <<'FEDORA_BUILD' 2>&1 | tee "$output_dir/build.log"
        set -euo pipefail
        : "${WM:?}" "${ANLAND_REPO:?}" "${ANLAND_COMMIT:?}"
        case "$WM" in denial|gnome|hyprland|mango|niri) ;; *) echo "Unknown WM: $WM" >&2; exit 1 ;; esac
        [[ $(uname -m) == aarch64 && $(id -u) == 0 ]] || { echo 'requires an ARM64 Fedora CI container' >&2; exit 1; }
        source /etc/os-release
        [[ $ID == fedora && $VERSION_ID == "$FEDORA_VERSION" ]] || exit 1
        dnf --setopt=install_weak_deps=False install -y git-core ca-certificates curl sudo \
            python3 util-linux rpm-build rpmdevtools dnf5-plugins tar xz findutils shadow-utils
        useradd -m -s /bin/bash anland
        printf 'anland ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/anland-dnf
        chmod 0440 /etc/sudoers.d/anland-dnf
        source_dir=/home/anland/.cache/anland-source
        mkdir -p "$source_dir"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
        git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
        [[ $(git -C "$source_dir" rev-parse HEAD) == "$ANLAND_COMMIT" ]]
        recipe="$source_dir/producers/$WM/Fedora${FEDORA_VERSION}_v5"
        test -s "$recipe/dependencies.lock"
        for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
        chown -R anland:anland /home/anland
        mkdir -p /output
        output_owner=$(stat -c '%u:%g' /output)
        restore_output_owner() {
            local build_rc=$?
            trap - EXIT
            if ! chown -Rh -- "$output_owner" /output; then
                printf 'Failed to restore output ownership to %s\n' "$output_owner" >&2
                if [[ $build_rc == 0 ]]; then build_rc=1; fi
            fi
            exit "$build_rc"
        }
        trap restore_output_owner EXIT
        chown anland:anland /output
        runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
            ANLAND_INSTALL=0 ANLAND_STAGE=build ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
            ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
            WORKDIR="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5" \
            ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
        cd /output/artifacts
        package_list="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/packages.list"
        checksums="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/SHA256SUMS"
        [[ -s $package_list ]] || package_list=/output/artifacts/packages.list
        [[ -s $checksums ]] || checksums=/output/artifacts/SHA256SUMS
        test -s "$package_list"
        sha256sum -c "$checksums"
        found=()
        while IFS= read -r package; do
            [[ $package == "${package##*/}" && $package == *.rpm && -s $package ]]
            architecture=$(rpm -qp --qf '%{ARCH}' "$package")
            [[ $architecture == aarch64 || $architecture == noarch ]]
            rpm -K "$package"
            found+=("$(rpm -qp --qf '%{NAME}' "$package")")
        done < "$package_list"
        actual=$(printf '%s\n' "${found[@]}" | sort)
        case "$WM" in
            mango) expected=$(printf '%s\n' mango-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            hyprland) expected=$(printf '%s\n' hyprland-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            denial) expected=$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            niri) expected=$(printf '%s\n' niri-anland xwayland-satellite xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            gnome) expected=$(printf '%s\n' mutter mutter-common mutter-devel xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
        esac
        [[ $actual == "$expected" ]] || { printf 'Incomplete Fedora package set:\n%s\nExpected:\n%s\n' "$actual" "$expected" >&2; exit 1; }
        chmod -R a+rX /output/artifacts
        printf 'RUNNER_BUILD_ARTIFACTS_OK WM=%s DISTRO=fedora%s COMMIT=%s\n' "$WM" "$FEDORA_VERSION" "$ANLAND_COMMIT"
        FEDORA_BUILD
      env:
        FEDORA_VERSION: ${{ matrix.target == 'Fedora44' && '44' || '43' }}
    - name: 在 Arch Linux ARM 中构建
      if: ${{ matrix.target == 'Arch' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        # 挂载父目录而不是 ARTIFACTS 本身，允许 build.sh 原子交换产物目录。
        docker run --rm -i \
          --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" \
          ogarcia/archlinux:latest \
          bash -s <<'ANLAND_ARCH_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial) ;; *) echo "未知的 WM：$WM" >&2; exit 1 ;; esac
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed base-devel git ca-certificates sudo \
              python gnupg cmake meson ninja pkgconf patchelf
            # Denial 使用系统原生 Ninja，避开锁定 depot_tools 的旧 Python wrapper。
            # 完整 engine/desktop 依赖由其 build.sh 的 ANLAND_WITH_DEPS=1 安装。
            if [ "$WM" = denial ]; then
              /usr/bin/ninja --version
              python3 --version
            fi
            # 只交付运行时包，避免 Arch 默认 debug 分包混入预期的软件包集合。
            printf '\nOPTIONS=("${OPTIONS[@]/#debug/!debug}")\n' >> /etc/makepkg.conf
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/anland-pacman
            chmod 0440 /etc/sudoers.d/anland-pacman
            if grep -q '^#PACMAN_AUTH=()' /etc/makepkg.conf; then
              sed -i 's/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/' /etc/makepkg.conf
            else
              printf '\nPACMAN_AUTH=(sudo)\n' >> /etc/makepkg.conf
            fi
            chown anland:anland /output

            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            chown -R anland:anland /home/anland
            recipe="$source_dir/producers/$WM/Arch_v5"
            test -f "$recipe/build.sh"
            test -f "$recipe/startup.sh"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            export WM
            su -m -s /bin/bash anland -c '
              export HOME=/home/anland
              export JOBS="$(nproc)" ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0
              export WORKDIR="$HOME/.cache/anland-$WM-arch-v5"
              case "$WM" in
                denial)
                  export ARTIFACTS_DIR=/output/artifacts
                  export ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1
                  bash "$HOME/.cache/anland-source/producers/denial/Arch_v5/build.sh" --noconfirm
                  ;;
                *)
                  export ARTIFACTS=/output/artifacts
                  bash "$HOME/.cache/anland-source/producers/$WM/Arch_v5/build.sh"
                  ;;
              esac
            '

            cd /output/artifacts
            shopt -s nullglob
            packages=(*.pkg.tar.xz *.pkg.tar.zst *.pkg.tar.gz)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              architecture=$(bsdtar -xOf "$package" .PKGINFO | awk '$1 == "arch" {print $3}')
              [[ $architecture == aarch64 || $architecture == any ]]
              found+=("$(LC_ALL=C pacman -Qp "$package" | awk 'NR == 1 {print $1}')")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xorg-xwayland | sort)" ;;
              hyprland) expected="$(printf '%s\n' hyprland-anland hyprpm-anland xorg-xwayland | sort)" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM COMMIT=$ANLAND_COMMIT"
        ANLAND_ARCH_WM_BUILD
    - name: 在 Debian 13 ARM64 中构建
      if: ${{ matrix.target == 'Debian13' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i \
          --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" \
          debian:trixie \
          bash -s <<'ANLAND_DEBIAN_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland) ;; *) echo "未知的 WM：$WM" >&2; exit 1 ;; esac
            export DEBIAN_FRONTEND=noninteractive
            # 仅限制一次性 CI 容器里的依赖安装，禁止 postinst 启动服务。
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod 0755 /usr/sbin/policy-rc.d
            if [ -f /etc/apt/sources.list.d/debian.sources ]; then
              sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
            else
              printf 'deb-src http://deb.debian.org/debian trixie main\n' \
                > /etc/apt/sources.list.d/anland-trixie-source.list
            fi
            # 最小 Debian 镜像尚无 CA 包；APT 使用签名校验，先沿用官方 HTTP 源。
            printf 'deb http://deb.debian.org/debian trixie-backports main\ndeb-src http://deb.debian.org/debian trixie-backports main\n' \
              > /etc/apt/sources.list.d/anland-backports.list
            apt-get update
            apt-get install -y --no-install-recommends \
              git ca-certificates curl build-essential cmake meson ninja-build pkgconf \
              ccache python3 dpkg-dev debhelper fakeroot quilt patch xz-utils zstd \
              unzip gettext file binutils libpipewire-0.3-dev

            useradd -m -s /bin/bash anland
            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            recipe="$source_dir/producers/$WM/Debian13_v5"
            test -s "$recipe/dependencies.lock"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            if [ "$WM" = mango ]; then
              xwayland_version="$(awk '$1 == "deb" && $2 == "xwayland" {print $3}' "$recipe/dependencies.lock")"
            else
              xwayland_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["xwayland"]["version"])' "$recipe/dependencies.lock")"
            fi
            test -n "$xwayland_version"
            # Xwayland 使用两个配方各自的锁定源码，不继承 WM 的私有库环境。
            apt-get build-dep -y --no-install-recommends "xwayland=$xwayland_version"
            case "$WM" in
              mango)
                # wlroots 读取 xwayland.pc；它属于 xwayland 二进制包，
                # apt-get build-dep 只装构建依赖，不会安装该包自身。
                # 此处仅准备 CI 依赖，最终仍由配方编译、打包修补版 Xwayland。
                apt-get install -y --no-install-recommends -t trixie-backports \
                  "xwayland=$xwayland_version" \
                  libinput-dev libudev-dev libseat-dev libdisplay-info-dev libliftoff-dev \
                  libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev glslang-tools \
                  libpcre2-dev libcjson-dev libpango1.0-dev libpixman-1-dev libwayland-dev \
                  libdrm-dev libxkbcommon-dev libffi-dev libexpat1-dev libxml2-dev bison \
                  libxcb1-dev libxcb-render0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
                  libxcb-icccm4-dev libxcb-composite0-dev libxcb-errors-dev libxcb-ewmh-dev \
                  libxcb-res0-dev libxcb-shape0-dev libxcb-shm0-dev xkb-data hwdata wayland-protocols
                # 按锁定源码启用的功能预检系统依赖，避免私有依赖编译后才报遗漏。
                # 新版 Wayland/libdrm/xkbcommon/pixman/protocols 由 bootstrap 提供，
                # 不能在这里用 Debian 的旧版本代替或要求其满足私有版本下限。
                xwayland_upstream="${xwayland_version#*:}"
                system_deps=(
                  libpipewire-0.3 libffi expat libxml-2.0
                  egl 'gbm >= 21.1' glesv2 libudev 'libseat >= 0.2.0' hwdata
                  'libdisplay-info >= 0.2.0' 'libinput >= 1.27.1'
                  libpcre2-8 libcjson pangocairo "xwayland = ${xwayland_upstream%-*}"
                  xcb xcb-composite xcb-ewmh xcb-icccm xcb-render
                  xcb-res 'xcb-xfixes >= 1.15' xcb-randr
                )
                pkg-config --print-errors --exists "${system_deps[@]}"
                for dependency in "${system_deps[@]}"; do
                  printf 'MANGO_SYSTEM_DEP %s: ' "$dependency"
                  pkg-config --modversion "$dependency"
                done
                for tool in bison glslang; do command -v "$tool"; done
                test -s "$(pkg-config --variable=pkgdatadir hwdata)/pnp.ids"
                test -x "$(pkg-config --variable=xwayland xwayland)"
                echo 'MANGO_SYSTEM_BUILD_DEPENDENCIES_OK'
                # Mango 的 ANLAND_WITH_DEPS=1 从 lockfile 构建新版私有图形依赖，
                # 不是 Arch 配方的 pacman 安装开关；不能在干净 Debian worker 上省略。
                ;;
              hyprland)
                python3 -c 'import json, sys; lock=json.load(open(sys.argv[1])); print("\n".join(name + "=" + entry["version"] for name, entry in lock["sources"].items()))' \
                  "$recipe/dependencies.lock" > /home/anland/.cache/hyprland-build-deps.list
                mapfile -t locked_sources < /home/anland/.cache/hyprland-build-deps.list
                test "${#locked_sources[@]}" -eq 5
                apt-get build-dep -y --no-install-recommends -t trixie-backports "${locked_sources[@]}"
                # Hyprgrass/wf-touch 不属于 Debian 源包的 Build-Depends。
                apt-get install -y --no-install-recommends libglm-dev libevdev-dev
                ;;
            esac
            chown -R anland:anland /home/anland
            chown anland:anland /output
            # Debian 入口固定输出到 recipe/artifacts；普通用户编译后再收集。
            runuser -u anland -- env HOME=/home/anland \
              JOBS="$(nproc)" ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-debian13-v5" \
              bash "$recipe/build.sh"

            mkdir -p /output/artifacts
            install -m644 "$recipe/artifacts/"*.deb "$recipe/artifacts/SHA256SUMS" \
              "$recipe/dependencies.lock" /output/artifacts/
            cd /output/artifacts
            sha256sum -c SHA256SUMS
            packages=(*.deb)
            found=()
            for package in "${packages[@]}"; do
              test -s "$package"
              [ "$(dpkg-deb -f "$package" Architecture)" = arm64 ]
              found+=("$(dpkg-deb -f "$package" Package)")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xwayland | sort)" ;;
              hyprland)
                expected="$(python3 -c 'import json, sys; lock=json.load(open(sys.argv[1])); print("\n".join(sorted([*lock["runtime_packages"].values(), "xwayland"])))' "$recipe/dependencies.lock")"
                ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            printf '%s\n' "${packages[@]}" > packages.list
            python3 - <<'PY_BUILD_INPUTS' > build-inputs.json
        import json, os
        print(json.dumps({
            'schema_version': 1, 'repository': os.environ['ANLAND_REPO'],
            'commit': os.environ['ANLAND_COMMIT'],
            'recipe': 'producers/' + os.environ['WM'] + '/Debian13_v5',
            'distribution': 'debian13', 'architecture': 'arm64',
            'install_artifacts': False, 'graphical_test': False,
        }, ensure_ascii=False, indent=2))
        PY_BUILD_INPUTS
            sha256sum "${packages[@]}" packages.list dependencies.lock build-inputs.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM DISTRO=debian13 COMMIT=$ANLAND_COMMIT"
        ANLAND_DEBIAN_WM_BUILD
    - name: 在 Ubuntu 26.04 ARM64 中构建
      if: ${{ matrix.target == 'ubuntu2604' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" ubuntu:26.04 \
          bash -s <<'ANLAND_UBUNTU_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial|niri) ;; *) echo "未知 WM：$WM" >&2; exit 1 ;; esac
            export DEBIAN_FRONTEND=noninteractive
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod 0755 /usr/sbin/policy-rc.d
            test -f /etc/apt/sources.list.d/ubuntu.sources
            sed -i -e 's/^Types: deb$/Types: deb deb-src/' \
              -e 's/^Components:.*/Components: main restricted universe multiverse/' \
              /etc/apt/sources.list.d/ubuntu.sources
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates curl sudo python3 util-linux
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/sed\n' > /etc/sudoers.d/anland-apt
            chmod 0440 /etc/sudoers.d/anland-apt
            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            recipe="$source_dir/producers/$WM/Ubuntu2604_v5"
            test -s "$recipe/dependencies.lock"
            test -s "$recipe/xwayland.lock"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            chown -R anland:anland /home/anland
            chown anland:anland /output
            runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
              ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
              ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-ubuntu2604-v5" \
              ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
            cd /output/artifacts
            shopt -s nullglob
            packages=(*.deb)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              [ "$(dpkg-deb -f "$package" Architecture)" = arm64 ]
              found+=("$(dpkg-deb -f "$package" Package)")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xwayland | sort)" ;;
              hyprland) expected="$(python3 -c 'import json,sys; lock=json.load(open(sys.argv[1])); print("\n".join(sorted([*lock["runtime_packages"].values(),"xwayland"])))' "$recipe/dependencies.lock")" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xwayland | sort)" ;;
              niri) expected="$(printf '%s\n' niri-anland xwayland-satellite xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM DISTRO=ubuntu2604 COMMIT=$ANLAND_COMMIT"
        ANLAND_UBUNTU_WM_BUILD
    - name: 只收集成品原生软件包
      id: package
      env:
        SLUG: ${{ steps.target.outputs.slug }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        python3 scripts/package-artifacts.py collect --target "$TARGET" \
          --destination "$asset_dir" "$output_dir/artifacts"
        echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"
    - name: 上传可下载的完整软件包
      id: upload
      uses: actions/upload-artifact@v6
      with:
        name: anland-hyprland-package-${{ steps.target.outputs.slug }}
        path: ${{ steps.package.outputs.asset_dir }}/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
    - name: 取回本次上传的完整产物
      uses: actions/download-artifact@v7
      with:
        name: anland-hyprland-package-${{ steps.target.outputs.slug }}
        path: ${{ runner.temp }}/anland-hyprland-${{ steps.target.outputs.slug }}-download
    - name: 确认上传后只有目标软件包且字节一致
      env:
        SLUG: ${{ steps.target.outputs.slug }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      shell: bash
      run: |
        set -euo pipefail
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        download_dir="$RUNNER_TEMP/anland-$WM-$SLUG-download"
        python3 scripts/package-artifacts.py verify --target "$TARGET" "$asset_dir" "$download_dir"
        {
          echo "### $WM $TARGET ARM64 构建通过"
          echo "- 来源提交：\`$ANLAND_COMMIT\`"
          echo "- [下载成品软件包]($ARTIFACT_URL)（保存 14 天）"
          echo '- 下载产物仅包含原生软件包，无签名、校验清单、密钥、构建元数据或日志。'
          echo '- 已逐包比对上传后取回的字节；未安装产物、未运行图形测试。'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: 构建失败时在控制台显示日志结尾
      if: ${{ failure() }}
      shell: bash
      run: |
        tail -n 80 "$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET/build.log" || true
  prepare-denial:
    name: 解析 Anland Denial 源码版本（各发行版共用同一提交）
    needs: select
    if: ${{ needs.select.outputs.denial == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ needs.select.outputs.denial_targets }}
    steps:
    - name: 要求从 main 分支触发
      shell: bash
      run: |
        if [ "$GITHUB_REF_NAME" != main ]; then
          echo "此工作流必须从 main 分支触发。" >&2
          exit 1
        fi
    - name: 将请求的源解析为单个提交
      id: resolve
      env:
        ANLAND_REPO: ${{ inputs.wm_repo || 'https://github.com/sjszero/anland.git' }}
        ANLAND_REF: ${{ inputs.wm_ref || 'legacy' }}
      shell: bash
      run: |
        set -euo pipefail
        source_dir="$RUNNER_TEMP/anland-denial-source"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
        anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
        git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
        echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
        echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"
  build-denial:
    name: 构建 Denial ${{ matrix.target }} ARM64 软件包
    needs: prepare-denial
    if: ${{ needs.prepare-denial.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-denial.outputs.targets) }}
    env:
      WM: denial
      TARGET: ${{ matrix.target }}
      ANLAND_REPO: ${{ inputs.wm_repo || 'https://github.com/sjszero/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-denial.outputs.anland_commit }}
    steps:
    - name: 检出云编译产物收集脚本
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - name: 解析 WM 发行版目标
      id: target
      shell: bash
      run: |
        set -euo pipefail
        case "$TARGET" in
          Arch) slug=arch; arch=aarch64 ;;
          Fedora43) slug=fedora43; arch=aarch64 ;;
          Fedora44) slug=fedora44; arch=aarch64 ;;
          Debian13) slug=debian13; arch=arm64 ;;
          ubuntu2604) slug=ubuntu2604; arch=arm64 ;;
          *) echo "不支持的构建目标：$TARGET" >&2; exit 1 ;;
        esac
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
    - name: 在 Fedora ARM64 中构建（匹配发行版源码和 ABI）
      if: ${{ matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT -e FEDORA_VERSION \
          -v "$output_dir:/output" "fedora:$FEDORA_VERSION" bash -s <<'FEDORA_BUILD' 2>&1 | tee "$output_dir/build.log"
        set -euo pipefail
        : "${WM:?}" "${ANLAND_REPO:?}" "${ANLAND_COMMIT:?}"
        case "$WM" in denial|gnome|hyprland|mango|niri) ;; *) echo "Unknown WM: $WM" >&2; exit 1 ;; esac
        [[ $(uname -m) == aarch64 && $(id -u) == 0 ]] || { echo 'requires an ARM64 Fedora CI container' >&2; exit 1; }
        source /etc/os-release
        [[ $ID == fedora && $VERSION_ID == "$FEDORA_VERSION" ]] || exit 1
        dnf --setopt=install_weak_deps=False install -y git-core ca-certificates curl sudo \
            python3 util-linux rpm-build rpmdevtools dnf5-plugins tar xz findutils shadow-utils
        useradd -m -s /bin/bash anland
        printf 'anland ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/anland-dnf
        chmod 0440 /etc/sudoers.d/anland-dnf
        source_dir=/home/anland/.cache/anland-source
        mkdir -p "$source_dir"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
        git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
        [[ $(git -C "$source_dir" rev-parse HEAD) == "$ANLAND_COMMIT" ]]
        recipe="$source_dir/producers/$WM/Fedora${FEDORA_VERSION}_v5"
        test -s "$recipe/dependencies.lock"
        for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
        chown -R anland:anland /home/anland
        mkdir -p /output
        output_owner=$(stat -c '%u:%g' /output)
        restore_output_owner() {
            local build_rc=$?
            trap - EXIT
            if ! chown -Rh -- "$output_owner" /output; then
                printf 'Failed to restore output ownership to %s\n' "$output_owner" >&2
                if [[ $build_rc == 0 ]]; then build_rc=1; fi
            fi
            exit "$build_rc"
        }
        trap restore_output_owner EXIT
        chown anland:anland /output
        runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
            ANLAND_INSTALL=0 ANLAND_STAGE=build ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
            ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
            WORKDIR="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5" \
            ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
        cd /output/artifacts
        package_list="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/packages.list"
        checksums="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/SHA256SUMS"
        [[ -s $package_list ]] || package_list=/output/artifacts/packages.list
        [[ -s $checksums ]] || checksums=/output/artifacts/SHA256SUMS
        test -s "$package_list"
        sha256sum -c "$checksums"
        found=()
        while IFS= read -r package; do
            [[ $package == "${package##*/}" && $package == *.rpm && -s $package ]]
            architecture=$(rpm -qp --qf '%{ARCH}' "$package")
            [[ $architecture == aarch64 || $architecture == noarch ]]
            rpm -K "$package"
            found+=("$(rpm -qp --qf '%{NAME}' "$package")")
        done < "$package_list"
        actual=$(printf '%s\n' "${found[@]}" | sort)
        case "$WM" in
            mango) expected=$(printf '%s\n' mango-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            hyprland) expected=$(printf '%s\n' hyprland-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            denial) expected=$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            niri) expected=$(printf '%s\n' niri-anland xwayland-satellite xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            gnome) expected=$(printf '%s\n' mutter mutter-common mutter-devel xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
        esac
        [[ $actual == "$expected" ]] || { printf 'Incomplete Fedora package set:\n%s\nExpected:\n%s\n' "$actual" "$expected" >&2; exit 1; }
        chmod -R a+rX /output/artifacts
        printf 'RUNNER_BUILD_ARTIFACTS_OK WM=%s DISTRO=fedora%s COMMIT=%s\n' "$WM" "$FEDORA_VERSION" "$ANLAND_COMMIT"
        FEDORA_BUILD
      env:
        FEDORA_VERSION: ${{ matrix.target == 'Fedora44' && '44' || '43' }}
    - name: 在 Arch Linux ARM 中构建
      if: ${{ matrix.target == 'Arch' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        # 挂载父目录而不是 ARTIFACTS 本身，允许 build.sh 原子交换产物目录。
        docker run --rm -i \
          --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" \
          ogarcia/archlinux:latest \
          bash -s <<'ANLAND_ARCH_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial) ;; *) echo "未知的 WM：$WM" >&2; exit 1 ;; esac
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed base-devel git ca-certificates sudo \
              python gnupg cmake meson ninja pkgconf patchelf
            # Denial 使用系统原生 Ninja，避开锁定 depot_tools 的旧 Python wrapper。
            # 完整 engine/desktop 依赖由其 build.sh 的 ANLAND_WITH_DEPS=1 安装。
            if [ "$WM" = denial ]; then
              /usr/bin/ninja --version
              python3 --version
            fi
            # 只交付运行时包，避免 Arch 默认 debug 分包混入预期的软件包集合。
            printf '\nOPTIONS=("${OPTIONS[@]/#debug/!debug}")\n' >> /etc/makepkg.conf
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/anland-pacman
            chmod 0440 /etc/sudoers.d/anland-pacman
            if grep -q '^#PACMAN_AUTH=()' /etc/makepkg.conf; then
              sed -i 's/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/' /etc/makepkg.conf
            else
              printf '\nPACMAN_AUTH=(sudo)\n' >> /etc/makepkg.conf
            fi
            chown anland:anland /output

            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            chown -R anland:anland /home/anland
            recipe="$source_dir/producers/$WM/Arch_v5"
            test -f "$recipe/build.sh"
            test -f "$recipe/startup.sh"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            export WM
            su -m -s /bin/bash anland -c '
              export HOME=/home/anland
              export JOBS="$(nproc)" ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0
              export WORKDIR="$HOME/.cache/anland-$WM-arch-v5"
              case "$WM" in
                denial)
                  export ARTIFACTS_DIR=/output/artifacts
                  export ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1
                  bash "$HOME/.cache/anland-source/producers/denial/Arch_v5/build.sh" --noconfirm
                  ;;
                *)
                  export ARTIFACTS=/output/artifacts
                  bash "$HOME/.cache/anland-source/producers/$WM/Arch_v5/build.sh"
                  ;;
              esac
            '

            cd /output/artifacts
            shopt -s nullglob
            packages=(*.pkg.tar.xz *.pkg.tar.zst *.pkg.tar.gz)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              architecture=$(bsdtar -xOf "$package" .PKGINFO | awk '$1 == "arch" {print $3}')
              [[ $architecture == aarch64 || $architecture == any ]]
              found+=("$(LC_ALL=C pacman -Qp "$package" | awk 'NR == 1 {print $1}')")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xorg-xwayland | sort)" ;;
              hyprland) expected="$(printf '%s\n' hyprland-anland hyprpm-anland xorg-xwayland | sort)" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM COMMIT=$ANLAND_COMMIT"
        ANLAND_ARCH_WM_BUILD
    - name: 在 Ubuntu 26.04 ARM64 中构建
      if: ${{ matrix.target == 'ubuntu2604' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" ubuntu:26.04 \
          bash -s <<'ANLAND_UBUNTU_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial|niri) ;; *) echo "未知 WM：$WM" >&2; exit 1 ;; esac
            export DEBIAN_FRONTEND=noninteractive
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod 0755 /usr/sbin/policy-rc.d
            test -f /etc/apt/sources.list.d/ubuntu.sources
            sed -i -e 's/^Types: deb$/Types: deb deb-src/' \
              -e 's/^Components:.*/Components: main restricted universe multiverse/' \
              /etc/apt/sources.list.d/ubuntu.sources
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates curl sudo python3 util-linux
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/sed\n' > /etc/sudoers.d/anland-apt
            chmod 0440 /etc/sudoers.d/anland-apt
            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            recipe="$source_dir/producers/$WM/Ubuntu2604_v5"
            test -s "$recipe/dependencies.lock"
            test -s "$recipe/xwayland.lock"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            chown -R anland:anland /home/anland
            chown anland:anland /output
            runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
              ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
              ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-ubuntu2604-v5" \
              ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
            cd /output/artifacts
            shopt -s nullglob
            packages=(*.deb)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              [ "$(dpkg-deb -f "$package" Architecture)" = arm64 ]
              found+=("$(dpkg-deb -f "$package" Package)")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xwayland | sort)" ;;
              hyprland) expected="$(python3 -c 'import json,sys; lock=json.load(open(sys.argv[1])); print("\n".join(sorted([*lock["runtime_packages"].values(),"xwayland"])))' "$recipe/dependencies.lock")" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xwayland | sort)" ;;
              niri) expected="$(printf '%s\n' niri-anland xwayland-satellite xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM DISTRO=ubuntu2604 COMMIT=$ANLAND_COMMIT"
        ANLAND_UBUNTU_WM_BUILD
    - name: 在 Debian 13 ARM64 中构建
      if: ${{ matrix.target == 'Debian13' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" debian:trixie bash -s \
          < scripts/build-anland-debian13-wm.sh 2>&1 | tee "$output_dir/build.log"
    - name: 只收集成品原生软件包
      id: package
      env:
        SLUG: ${{ steps.target.outputs.slug }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        python3 scripts/package-artifacts.py collect --target "$TARGET" \
          --destination "$asset_dir" "$output_dir/artifacts"
        echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"
    - name: 上传可下载的完整软件包
      id: upload
      uses: actions/upload-artifact@v6
      with:
        name: anland-denial-package-${{ steps.target.outputs.slug }}
        path: ${{ steps.package.outputs.asset_dir }}/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
    - name: 取回本次上传的完整产物
      uses: actions/download-artifact@v7
      with:
        name: anland-denial-package-${{ steps.target.outputs.slug }}
        path: ${{ runner.temp }}/anland-denial-${{ steps.target.outputs.slug }}-download
    - name: 确认上传后只有目标软件包且字节一致
      env:
        SLUG: ${{ steps.target.outputs.slug }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      shell: bash
      run: |
        set -euo pipefail
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        download_dir="$RUNNER_TEMP/anland-$WM-$SLUG-download"
        python3 scripts/package-artifacts.py verify --target "$TARGET" "$asset_dir" "$download_dir"
        {
          echo "### $WM $TARGET ARM64 构建通过"
          echo "- 来源提交：\`$ANLAND_COMMIT\`"
          echo "- [下载成品软件包]($ARTIFACT_URL)（保存 14 天）"
          echo '- 下载产物仅包含原生软件包，无签名、校验清单、密钥、构建元数据或日志。'
          echo '- 已逐包比对上传后取回的字节；未安装产物、未运行图形测试。'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: 构建失败时在控制台显示日志结尾
      if: ${{ failure() }}
      shell: bash
      run: |
        tail -n 80 "$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET/build.log" || true
  prepare-niri:
    name: 解析 Anland Niri 源码版本
    needs: select
    if: ${{ needs.select.outputs.niri == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ needs.select.outputs.niri_targets }}
    steps:
    - name: 要求从 main 分支触发
      shell: bash
      run: |
        if [ "$GITHUB_REF_NAME" != main ]; then
          echo "此工作流必须从 main 分支触发。" >&2
          exit 1
        fi
    - name: 将请求的源解析为单个提交
      id: resolve
      env:
        ANLAND_REPO: ${{ inputs.niri_repo || 'https://github.com/sjszero/anland.git' }}
        ANLAND_REF: ${{ inputs.niri_ref || 'legacy' }}
      shell: bash
      run: |
        set -euo pipefail
        source_dir="$(mktemp -d)/anland"
        trap 'rm -rf "${source_dir%/anland}"' EXIT
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
        anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
        git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
        echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
        echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"
  build-niri:
    name: 构建 Niri ${{ matrix.target }} ARM64 软件包
    needs: prepare-niri
    runs-on: ubuntu-24.04-arm
    env:
      ANLAND_REPO: ${{ inputs.niri_repo || 'https://github.com/sjszero/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-niri.outputs.anland_commit }}
      WM: niri
      TARGET: ${{ matrix.target }}
    steps:
    - name: 检出云编译产物收集脚本
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - name: 在 Fedora ARM64 中构建（匹配发行版源码和 ABI）
      if: ${{ matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT -e FEDORA_VERSION \
          -v "$output_dir:/output" "fedora:$FEDORA_VERSION" bash -s <<'FEDORA_BUILD' 2>&1 | tee "$output_dir/build.log"
        set -euo pipefail
        : "${WM:?}" "${ANLAND_REPO:?}" "${ANLAND_COMMIT:?}"
        case "$WM" in denial|gnome|hyprland|mango|niri) ;; *) echo "Unknown WM: $WM" >&2; exit 1 ;; esac
        [[ $(uname -m) == aarch64 && $(id -u) == 0 ]] || { echo 'requires an ARM64 Fedora CI container' >&2; exit 1; }
        source /etc/os-release
        [[ $ID == fedora && $VERSION_ID == "$FEDORA_VERSION" ]] || exit 1
        dnf --setopt=install_weak_deps=False install -y git-core ca-certificates curl sudo \
            python3 util-linux rpm-build rpmdevtools dnf5-plugins tar xz findutils shadow-utils
        useradd -m -s /bin/bash anland
        printf 'anland ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/anland-dnf
        chmod 0440 /etc/sudoers.d/anland-dnf
        source_dir=/home/anland/.cache/anland-source
        mkdir -p "$source_dir"
        git init --quiet "$source_dir"
        git -C "$source_dir" remote add origin "$ANLAND_REPO"
        git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
        git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
        [[ $(git -C "$source_dir" rev-parse HEAD) == "$ANLAND_COMMIT" ]]
        recipe="$source_dir/producers/$WM/Fedora${FEDORA_VERSION}_v5"
        test -s "$recipe/dependencies.lock"
        for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
        chown -R anland:anland /home/anland
        mkdir -p /output
        output_owner=$(stat -c '%u:%g' /output)
        restore_output_owner() {
            local build_rc=$?
            trap - EXIT
            if ! chown -Rh -- "$output_owner" /output; then
                printf 'Failed to restore output ownership to %s\n' "$output_owner" >&2
                if [[ $build_rc == 0 ]]; then build_rc=1; fi
            fi
            exit "$build_rc"
        }
        trap restore_output_owner EXIT
        chown anland:anland /output
        runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
            ANLAND_INSTALL=0 ANLAND_STAGE=build ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
            ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
            WORKDIR="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5" \
            ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
        cd /output/artifacts
        package_list="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/packages.list"
        checksums="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/SHA256SUMS"
        [[ -s $package_list ]] || package_list=/output/artifacts/packages.list
        [[ -s $checksums ]] || checksums=/output/artifacts/SHA256SUMS
        test -s "$package_list"
        sha256sum -c "$checksums"
        found=()
        while IFS= read -r package; do
            [[ $package == "${package##*/}" && $package == *.rpm && -s $package ]]
            architecture=$(rpm -qp --qf '%{ARCH}' "$package")
            [[ $architecture == aarch64 || $architecture == noarch ]]
            rpm -K "$package"
            found+=("$(rpm -qp --qf '%{NAME}' "$package")")
        done < "$package_list"
        actual=$(printf '%s\n' "${found[@]}" | sort)
        case "$WM" in
            mango) expected=$(printf '%s\n' mango-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            hyprland) expected=$(printf '%s\n' hyprland-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            denial) expected=$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            niri) expected=$(printf '%s\n' niri-anland xwayland-satellite xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
            gnome) expected=$(printf '%s\n' mutter mutter-common mutter-devel xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
        esac
        [[ $actual == "$expected" ]] || { printf 'Incomplete Fedora package set:\n%s\nExpected:\n%s\n' "$actual" "$expected" >&2; exit 1; }
        chmod -R a+rX /output/artifacts
        printf 'RUNNER_BUILD_ARTIFACTS_OK WM=%s DISTRO=fedora%s COMMIT=%s\n' "$WM" "$FEDORA_VERSION" "$ANLAND_COMMIT"
        FEDORA_BUILD
      env:
        FEDORA_VERSION: ${{ matrix.target == 'Fedora44' && '44' || '43' }}
    - name: 在 Arch Linux ARM 中构建软件包
      shell: bash
      run: |
        set -euo pipefail
        output_dir=.niri-package-build/arch
        rm -rf "$output_dir"
        mkdir -p "$output_dir"
        docker run --rm -i \
          --platform linux/arm64 \
          -e ANLAND_REPO \
          -e ANLAND_COMMIT \
          -v "$PWD/$output_dir:/packages" \
          ogarcia/archlinux:latest \
          bash -s <<'ANLAND_BUILD'
            set -euo pipefail
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed base-devel git ca-certificates sudo
            useradd -m -s /bin/bash anland
            printf "anland ALL=(root) NOPASSWD: /usr/bin/pacman\n" > /etc/sudoers.d/anland-pacman
            chmod 0440 /etc/sudoers.d/anland-pacman
            if grep -q "^#PACMAN_AUTH=()" /etc/makepkg.conf; then
              sed -i "s/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/" /etc/makepkg.conf
            else
              printf "\nPACMAN_AUTH=(sudo)\n" >> /etc/makepkg.conf
            fi
            chown -R anland:anland /packages

            mkdir -p /home/anland/.cache/anland-source
            git init --quiet /home/anland/.cache/anland-source
            git -C /home/anland/.cache/anland-source remote add origin "$ANLAND_REPO"
            git -C /home/anland/.cache/anland-source fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C /home/anland/.cache/anland-source checkout --quiet --detach FETCH_HEAD
            chown -R anland:anland /home/anland
            printf '\nOPTIONS=("${OPTIONS[@]/#debug/!debug}")\n' >> /etc/makepkg.conf
            test -f /home/anland/.cache/anland-source/producers/niri/Arch_v5/build.sh
            su -s /bin/bash anland -c 'cd /home/anland/.cache/anland-source/producers/niri/Arch_v5 && ANLAND_INSTALL=0 WORKDIR=/packages ./build.sh --noconfirm'
            chmod -R a+rX /packages

            package_dir=/packages/packages
            niri_package=
            found_niri=false
            found_xwayland=false
            while IFS= read -r package; do
              package_name="$(LC_ALL=C pacman -Qp "$package" | awk 'NR == 1 { print $1 }')"
              case "$package_name" in
                niri-anland)
                  niri_package="$package"
                  found_niri=true
                  ;;
                xorg-xwayland)
                  found_xwayland=true
                  ;;
                *) echo "构建生成了意外的 Arch 包：$package_name" >&2; exit 1 ;;
              esac
            done < <(find "$package_dir" -maxdepth 1 -type f -name '*.pkg.tar.*' \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' -o -name '*.pkg.tar.gz' \) -print | sort)
            [ "$found_niri" = true ] || { echo "未找到 niri-anland pacman 包" >&2; exit 1; }
            [ "$found_xwayland" = true ] || { echo "未找到打过补丁的 xorg-xwayland pacman 包" >&2; exit 1; }
            package_version="$(LC_ALL=C pacman -Qp "$niri_package" | awk 'NR == 1 { print $2 }')"
            package_version="${package_version#*:}"
            package_version="${package_version%-*}"
            case "$package_version" in
              ''|*[!A-Za-z0-9.+~_-]*) echo "无效的 Niri 包版本：$package_version" >&2; exit 1 ;;
            esac
            printf '%s\n' "$package_version" > /packages/.niri-version
        ANLAND_BUILD
      if: ${{ matrix.target == 'Arch' }}
    - name: 打包发布资产
      id: arch_package
      shell: bash
      run: |
        set -euo pipefail
        output_dir=.niri-package-build/arch
        package_dir="$RUNNER_TEMP/anland-niri-packages/arch"
        release_dir="$GITHUB_WORKSPACE/.release-assets/niri"
        rm -rf "$package_dir" "$release_dir"
        mkdir -p "$package_dir" "$release_dir"
        python3 scripts/package-artifacts.py collect --target Arch --destination "$package_dir" "$output_dir/packages"
        package_count="$(find "$package_dir" -maxdepth 1 -type f -name '*.pkg.tar.*' \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' -o -name '*.pkg.tar.gz' \) | wc -l)"
        [ "$package_count" -gt 0 ] || { echo "没有收集到 pacman 软件包" >&2; exit 1; }
        version="$(tr -d '[:space:]' < "$output_dir/.niri-version")"
        case "$version" in
          ''|*[!A-Za-z0-9.+~_-]*) echo "无效的 Niri 包版本：$version" >&2; exit 1 ;;
        esac
        build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        asset="anland-niri-arch-${version}-aarch64.tar.gz"
        tar --mtime="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -C "$RUNNER_TEMP" -czf "$release_dir/$asset" anland-niri-packages/arch
        python3 scripts/package-artifacts.py verify-archive --target Arch "$release_dir/$asset"
        echo "asset_path=$release_dir/$asset" >> "$GITHUB_OUTPUT"
        echo "已将 $package_count 个包打包为 $asset"
      if: ${{ matrix.target == 'Arch' }}
    - name: 上传构建资产
      uses: actions/upload-artifact@v6
      with:
        name: anland-niri-package-arch
        path: ${{ steps.arch_package.outputs.asset_path }}
        if-no-files-found: error
        retention-days: 1
      if: ${{ matrix.target == 'Arch' }}
    - id: target
      if: ${{ matrix.target == 'ubuntu2604' || matrix.target == 'Debian13' || matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      name: 解析 WM 发行版目标
      run: |
        set -euo pipefail
        case "$TARGET" in
          Arch) slug=arch; arch=aarch64 ;;
          Fedora43) slug=fedora43; arch=aarch64 ;;
          Fedora44) slug=fedora44; arch=aarch64 ;;
          Debian13) slug=debian13; arch=arm64 ;;
          ubuntu2604) slug=ubuntu2604; arch=arm64 ;;
          *) echo "不支持的构建目标：$TARGET" >&2; exit 1 ;;
        esac
        echo "slug=$slug" >> "$GITHUB_OUTPUT"
        echo "arch=$arch" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: ${{ matrix.target == 'ubuntu2604' }}
      name: 在 Ubuntu 26.04 ARM64 中构建
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" ubuntu:26.04 \
          bash -s <<'ANLAND_UBUNTU_WM_BUILD' 2>&1 | tee "$output_dir/build.log"
            set -euo pipefail
            case "$WM" in mango|hyprland|denial|niri) ;; *) echo "未知 WM：$WM" >&2; exit 1 ;; esac
            export DEBIAN_FRONTEND=noninteractive
            printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
            chmod 0755 /usr/sbin/policy-rc.d
            test -f /etc/apt/sources.list.d/ubuntu.sources
            sed -i -e 's/^Types: deb$/Types: deb deb-src/' \
              -e 's/^Components:.*/Components: main restricted universe multiverse/' \
              /etc/apt/sources.list.d/ubuntu.sources
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates curl sudo python3 util-linux
            useradd -m -s /bin/bash anland
            printf 'anland ALL=(root) NOPASSWD: /usr/bin/apt-get, /usr/bin/sed\n' > /etc/sudoers.d/anland-apt
            chmod 0440 /etc/sudoers.d/anland-apt
            source_dir=/home/anland/.cache/anland-source
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" remote add origin "$ANLAND_REPO"
            git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
            git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
            recipe="$source_dir/producers/$WM/Ubuntu2604_v5"
            test -s "$recipe/dependencies.lock"
            test -s "$recipe/xwayland.lock"
            for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
            chown -R anland:anland /home/anland
            chown anland:anland /output
            runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
              ANLAND_INSTALL=0 ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
              ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-ubuntu2604-v5" \
              ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
            cd /output/artifacts
            shopt -s nullglob
            packages=(*.deb)
            [ "${#packages[@]}" -gt 0 ]
            found=()
            for package in "${packages[@]}"; do
              [[ -f "$package" && ! -L "$package" && -s "$package" ]]
              [ "$(dpkg-deb -f "$package" Architecture)" = arm64 ]
              found+=("$(dpkg-deb -f "$package" Package)")
            done
            actual="$(printf '%s\n' "${found[@]}" | sort)"
            case "$WM" in
              mango) expected="$(printf '%s\n' mango-anland xwayland | sort)" ;;
              hyprland) expected="$(python3 -c 'import json,sys; lock=json.load(open(sys.argv[1])); print("\n".join(sorted([*lock["runtime_packages"].values(),"xwayland"])))' "$recipe/dependencies.lock")" ;;
              denial) expected="$(printf '%s\n' denial-anland-engine denial denial-desktop xwayland | sort)" ;;
              niri) expected="$(printf '%s\n' niri-anland xwayland-satellite xwayland | sort)" ;;
            esac
            [ "$actual" = "$expected" ] || { echo "软件包集合不完整：$actual" >&2; exit 1; }
            sha256sum "${packages[@]}"
            chmod -R a+rX /output/artifacts
            echo "RUNNER_BUILD_ARTIFACTS_OK WM=$WM DISTRO=ubuntu2604 COMMIT=$ANLAND_COMMIT"
        ANLAND_UBUNTU_WM_BUILD
      shell: bash
    - name: 在 Debian 13 ARM64 中构建
      if: ${{ matrix.target == 'Debian13' }}
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        mkdir -p "$output_dir"
        docker run --rm -i --platform linux/arm64 \
          -e WM -e ANLAND_REPO -e ANLAND_COMMIT \
          -v "$output_dir:/output" debian:trixie bash -s \
          < scripts/build-anland-debian13-wm.sh 2>&1 | tee "$output_dir/build.log"
    - env:
        SLUG: ${{ steps.target.outputs.slug }}
      id: package
      if: ${{ matrix.target == 'ubuntu2604' || matrix.target == 'Debian13' || matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      name: 只收集成品原生软件包
      run: |
        set -euo pipefail
        output_dir="$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET"
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        python3 scripts/package-artifacts.py collect --target "$TARGET" \
          --destination "$asset_dir" "$output_dir/artifacts"
        echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: upload
      if: ${{ matrix.target == 'ubuntu2604' || matrix.target == 'Debian13' || matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      name: 上传可下载的完整软件包
      uses: actions/upload-artifact@v6
      with:
        compression-level: 0
        if-no-files-found: error
        name: anland-niri-package-${{ steps.target.outputs.slug }}
        path: ${{ steps.package.outputs.asset_dir }}/*
        retention-days: 14
    - if: ${{ matrix.target == 'ubuntu2604' || matrix.target == 'Debian13' || matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      name: 取回本次上传的完整产物
      uses: actions/download-artifact@v7
      with:
        name: anland-niri-package-${{ steps.target.outputs.slug }}
        path: ${{ runner.temp }}/anland-niri-${{ steps.target.outputs.slug }}-download
    - env:
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        SLUG: ${{ steps.target.outputs.slug }}
      if: ${{ matrix.target == 'ubuntu2604' || matrix.target == 'Debian13' || matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
      name: 确认上传后只有目标软件包且字节一致
      run: |
        set -euo pipefail
        asset_dir="$GITHUB_WORKSPACE/.release-assets/$WM-$SLUG"
        download_dir="$RUNNER_TEMP/anland-$WM-$SLUG-download"
        python3 scripts/package-artifacts.py verify --target "$TARGET" "$asset_dir" "$download_dir"
        {
          echo "### $WM $TARGET ARM64 构建通过"
          echo "- 来源提交：\`$ANLAND_COMMIT\`"
          echo "- [下载成品软件包]($ARTIFACT_URL)（保存 14 天）"
          echo '- 下载产物仅包含原生软件包，无签名、校验清单、密钥、构建元数据或日志。'
          echo '- 已逐包比对上传后取回的字节；未安装产物、未运行图形测试。'
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - if: ${{ failure() && (matrix.target == 'ubuntu2604' || matrix.target == 'Debian13' || matrix.target == 'Fedora43' || matrix.target == 'Fedora44') }}
      name: 构建失败时在控制台显示日志结尾
      shell: bash
      run: |
        tail -n 80 "$GITHUB_WORKSPACE/.wm-package-build/$WM/$TARGET/build.log" || true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-niri.outputs.targets) }}
  release-niri:
    name: 更新 Anland Niri 滚动发布
    needs:
    - prepare-niri
    - build-niri
    if: ${{ always() && !cancelled() && needs.prepare-niri.result == 'success' && contains(needs.prepare-niri.outputs.targets, 'Arch') }}
    runs-on: ubuntu-26.04
    concurrency:
      group: anland-niri-package-release
      cancel-in-progress: false
    steps:
    - name: 检出发布脚本
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - name: 确保滚动标签存在
      shell: bash
      run: |
        set -euo pipefail
        tag=anland-niri-packages
        if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
          echo "滚动标签 ${tag} 已存在。"
        elif git tag "$tag" "$GITHUB_SHA" && git push origin "refs/tags/${tag}"; then
          echo "已创建滚动标签 ${tag}。"
        elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
          echo "滚动标签 ${tag} 已由并发任务创建。"
        else
          echo "无法确认或创建滚动标签 ${tag}。" >&2
          exit 1
        fi
    - name: 下载 Niri 构建资产
      uses: actions/download-artifact@v7
      with:
        name: anland-niri-package-arch
        path: release-assets
    - name: 更新固定发布与软件包清单
      env:
        GH_TOKEN: ${{ github.token }}
        ANLAND_REPO: ${{ inputs.niri_repo || 'https://github.com/sjszero/anland.git' }}
        ANLAND_REF: ${{ inputs.niri_ref || 'legacy' }}
        ANLAND_COMMIT: ${{ needs.prepare-niri.outputs.anland_commit }}
      shell: bash
      run: |
        set -euo pipefail
        release_dir="$GITHUB_WORKSPACE/release-assets"
        rolling_release_tag=anland-niri-packages
        archive="$(find "$release_dir" -maxdepth 1 -type f -name 'anland-niri-arch-*-aarch64.tar.gz' -print)"
        [ -n "$archive" ] && [ "$(printf '%s\n' "$archive" | wc -l)" -eq 1 ] || {
          echo "没有且仅有一个 Niri 发布归档。" >&2; exit 1;
        }
        asset="${archive##*/}"
        build_time="$(python3 scripts/package-artifacts.py archive-time --target Arch "$archive")"
        version="${asset#anland-niri-arch-}"
        version="${version%-aarch64.tar.gz}"
        [ -n "$build_time" ] && [ -n "$version" ] || { echo "Niri 构建元数据无效。" >&2; exit 1; }
        {
          printf 'format=1\nrelease_tag=%s\nrevision=run-%s-%s\ngenerated_at=%s\n' "$rolling_release_tag" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          printf 'source_repository=%s\nsource_ref=%s\nsource_commit=%s\narch=%s\n' "$ANLAND_REPO" "$ANLAND_REF" "$ANLAND_COMMIT" "$asset"
        } > "$release_dir/anland-niri-manifest"
        cp scripts/tui/install-anland-niri.sh "$release_dir/install-anland-niri.sh"
        chmod +x "$release_dir/install-anland-niri.sh"
        (cd "$release_dir" && sha256sum "$asset" anland-niri-manifest install-anland-niri.sh > SHA256SUMS)
        notes="$(printf '%s\n' \
          '# Anland Niri Arch ARM64 预编译包' '' \
          '包含 Niri Anland backend 与打过补丁的 Xwayland pacman 软件包。归档内目录为 `anland-niri-packages/arch/`。' '' \
          '## 发布资产' '' \
          "- [${asset}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${rolling_release_tag}/${asset})（Arch Linux ARM64，Niri ${version}，构建时间 ${build_time}）" \
          '- `anland-niri-manifest` 描述来源提交及平台资产。' \
          '- `install-anland-niri.sh` 可在目标 Arch Linux ARM 系统中安装或卸载软件包。' \
          '- `SHA256SUMS` 校验发布归档、manifest 与安装脚本。' '' \
          "源码：\`${ANLAND_REPO}\` @ \`${ANLAND_COMMIT}\`（请求：\`${ANLAND_REF}\`）。" \
          "工作流提交：\`${GITHUB_SHA}\`。")"

        release_exists=false
        gh release view "$rolling_release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && release_exists=true || true
        if [ "$release_exists" = true ]; then
          gh release upload "$rolling_release_tag" "$archive" "$release_dir/install-anland-niri.sh" "$release_dir/anland-niri-manifest" "$release_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
          asset_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" --jq '.assets[] | [.id, .name] | @tsv')"
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            case "$asset_name" in
              anland-niri-arch-*-aarch64.tar.gz)
                [ "$asset_name" = "$asset" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                ;;
            esac
          done <<< "$asset_rows"
          gh release edit "$rolling_release_tag" --repo "$GITHUB_REPOSITORY" \
            --title 'Anland Niri Arch ARM64 预编译包' --notes "$notes" --draft=false --latest=false
        else
          gh release create "$rolling_release_tag" "$archive" "$release_dir/install-anland-niri.sh" "$release_dir/anland-niri-manifest" "$release_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --draft --latest=false --target "$GITHUB_SHA" \
            --title 'Anland Niri Arch ARM64 预编译包' --notes "$notes"
          gh release edit "$rolling_release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
        fi
        echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$rolling_release_tag"
    - name: 同步到 CNB 国内镜像
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_cnb }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        CNB_REPO: ${{ vars.CNB_REPO }}
      run: |-
        bash scripts/publish-cnb-release.sh anland-niri-packages

  # ==========================================================================
  # Anland KDE Wayland（kwin + Xwayland）
  # ==========================================================================
  prepare-kde:
    name: 解析 Anland KDE 源码版本
    needs: select
    if: ${{ needs.select.outputs.kde == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 生成构建矩阵
        id: targets
        env:
          BUILD_TARGET_INPUT: ${{ inputs.kde_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET_INPUT" in
            all)
              targets='["ubuntu2604","Debian13","Fedora43","Fedora44","Arch"]'
              ;;
            ubuntu2604|Debian13|Fedora43|Fedora44|Arch)
              targets="[\"$BUILD_TARGET_INPUT\"]"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "构建目标：$targets"

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 将请求的源解析为单个提交
        id: resolve
        env:
          ANLAND_REPO: ${{ inputs.kde_repo || 'https://github.com/sjszero/anland.git' }}
          ANLAND_REF: ${{ inputs.kde_ref || 'legacy' }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(mktemp -d)/anland"
          trap 'rm -rf "${source_dir%/anland}"' EXIT
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
          anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
          echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
          echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"

  build-kde:
    name: 构建 KDE ${{ matrix.target }} 软件包
    needs: prepare-kde
    runs-on: ubuntu-24.04-arm
    # 单个平台失败不阻止其余软件包和发布合并；发布阶段会复用上一版该平台资产。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-kde.outputs.targets) }}

    env:
      ANLAND_REPO: ${{ inputs.kde_repo || 'https://github.com/sjszero/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-kde.outputs.anland_commit }}
      BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: 检出云编译产物收集脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: 解析构建目标
        id: target
        shell: bash
        run: |
          set -euo pipefail

          build_xwayland=0
          kwin_source=''
          case "$BUILD_TARGET" in
            ubuntu2604)
              image=ubuntu:26.04
              script=producers/kde/ubuntu2604_v5/build.sh
              package_pattern='*.deb'
              asset_prefix=anland-kde-ubuntu2604-kwin-
              asset_arch=arm64
              archive_target=ubuntu2604
              ;;
            Debian13)
              image=debian:trixie
              script=producers/kde/Debian13_v5/build.sh
              package_pattern='*.deb'
              asset_prefix=anland-kde-debian13-kwin-
              asset_arch=arm64
              archive_target=debian13
              ;;
            Fedora43)
              image=fedora:43
              script=producers/kde/Fedora43_v5/build.sh
              build_xwayland=1
              package_pattern='*.rpm'
              asset_prefix=anland-kde-fedora43-kwin-
              asset_arch=aarch64
              archive_target=fedora43
              ;;
            Fedora44)
              image=fedora:44
              script=producers/kde/Fedora44_v5/build.sh
              build_xwayland=1
              kwin_source=kwin-6.7.5-1.fc44
              package_pattern='*.rpm'
              asset_prefix=anland-kde-fedora44-kwin-
              asset_arch=aarch64
              archive_target=fedora44
              ;;
            Arch)
              image=ogarcia/archlinux:latest
              script=producers/kde/Arch_v5/build.sh
              package_pattern='*.pkg.tar.*'
              asset_prefix=anland-kde-arch-kwin-
              asset_arch=aarch64
              archive_target=arch
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET" >&2
              exit 1
              ;;
          esac

          {
            echo "image=$image"
            echo "script=$script"
            echo "package_pattern=$package_pattern"
            echo "asset_prefix=$asset_prefix"
            echo "asset_arch=$asset_arch"
            echo "archive_target=$archive_target"
            echo "build_xwayland=$build_xwayland"
            echo "kwin_source=$kwin_source"
          } >> "$GITHUB_OUTPUT"

      - name: 在对应的发行版中构建软件包
        env:
          DISTRO_IMAGE: ${{ steps.target.outputs.image }}
          BUILD_SCRIPT: ${{ steps.target.outputs.script }}
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          BUILD_XWAYLAND: ${{ steps.target.outputs.build_xwayland }}
          KWIN_SOURCE: ${{ steps.target.outputs.kwin_source }}
          OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          docker run --rm -i \
            --platform linux/arm64 \
            -e ANLAND_REPO \
            -e ANLAND_COMMIT \
            -e BUILD_SCRIPT \
            -e BUILD_TARGET \
            -e BUILD_XWAYLAND \
            -e KWIN_SOURCE \
            -e PKG_PATTERN \
            -v "$PWD/$OUTPUT_DIR:/root/kde-packages" \
            -v "$PWD/$OUTPUT_DIR:/tmp/kde-packages" \
            "$DISTRO_IMAGE" \
            bash -s <<'ANLAND_BUILD'
              set -euo pipefail

              case "$BUILD_TARGET" in
                Debian13|ubuntu2604)
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    git ca-certificates sudo \
                    build-essential devscripts dpkg-dev fakeroot patch
                  ;;
                Fedora43|Fedora44)
                  dnf install -y --setopt=install_weak_deps=False \
                    git ca-certificates sudo \
                    dnf-plugins-core rpmdevtools rpm-build patch tar xz
                  ;;
                Arch)
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm --needed base-devel git ca-certificates sudo
                  useradd -m -s /bin/bash anland
                  printf "anland ALL=(root) NOPASSWD: /usr/bin/pacman\n" > /etc/sudoers.d/anland-pacman
                  chmod 0440 /etc/sudoers.d/anland-pacman
                  if grep -q "^#PACMAN_AUTH=()" /etc/makepkg.conf; then
                    sed -i "s/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/" /etc/makepkg.conf
                  else
                    printf "\nPACMAN_AUTH=(sudo)\n" >> /etc/makepkg.conf
                  fi
                  chown -R anland:anland /tmp/kde-packages
                  ;;
              esac

              git init --quiet /tmp/anland
              git -C /tmp/anland remote add origin "$ANLAND_REPO"
              git -C /tmp/anland fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
              git -C /tmp/anland checkout --quiet --detach FETCH_HEAD

              producer_source=/tmp/anland/libdisplay_producer
              case "$BUILD_TARGET" in
                # These are the overlays consumed by the distribution build
                # scripts.  Do not validate the similarly named, unused
                # anland_backend_* source trees instead.
                ubuntu2604) backend_dir=/tmp/anland/producers/kde/ubuntu2604_v5/kwin/src/backends/anland ;;
                Debian13) backend_dir=/tmp/anland/producers/kde/Debian13_v5/kwin/src/backends/anland ;;
                Fedora43|Fedora44) backend_dir=/tmp/anland/producers/kde/${BUILD_TARGET}_v5/kwin/src/backends/anland ;;
                Arch) backend_dir=/tmp/anland/producers/kde/Arch_v5/kwin/src/backends/anland ;;
                *) echo "不支持的构建目标：$BUILD_TARGET" >&2; exit 1 ;;
              esac
              producer_dir="$backend_dir/libdisplay_producer"

              if [ ! -f "$producer_source/display_producer.h" ]; then
                echo "Anland 源码缺少共享头文件：$producer_source/display_producer.h" >&2
                exit 1
              fi
              if [ -L "$producer_dir" ]; then
                rm -f -- "$producer_dir"
                mkdir -p "$producer_dir"
                cp -aL -- "$producer_source/." "$producer_dir/"
              fi
              if [ -L "$producer_dir" ] || [ ! -d "$producer_dir" ]; then
                echo "KWin backend 的 display producer 目录无效：$producer_dir" >&2
                exit 1
              fi
              for required_file in display_producer.h display_producer.c protocol.h; do
                if [ ! -f "$producer_dir/$required_file" ]; then
                  echo "KWin backend 缺少 display producer 文件：$producer_dir/$required_file" >&2
                  exit 1
                fi
              done

              # The Anland headers are included by both the kwin library and
              # the separate kwin_wayland executable. target_include_directories
              # on the former is PRIVATE, so its libdisplay_producer include
              # path is not visible while compiling main_wayland.cpp. Make the
              # public headers self-contained for every distro overlay.
              find "$backend_dir" -maxdepth 1 -type f -name '*.h' -exec \
                sed -i \
                  -e 's@#include "display_producer.h"@#include "libdisplay_producer/display_producer.h"@' \
                  -e 's@#include "protocol.h"@#include "libdisplay_producer/protocol.h"@' \
                {} +
              if grep -R -F --include='*.h' '#include "display_producer.h"' "$backend_dir"; then
                echo "KWin backend 公开头文件仍依赖未导出的 display producer include 路径。" >&2
                exit 1
              fi

              # Debian 13 使用 DEB822 源；上游构建脚本要求 deb-src。
              if [ "$BUILD_TARGET" = Debian13 ] && [ -f /etc/apt/sources.list.d/debian.sources ]; then
                sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
                apt-get update
              fi

              test -f "/tmp/anland/$BUILD_SCRIPT"
              chmod +x "/tmp/anland/$BUILD_SCRIPT"

              if [ "$BUILD_TARGET" = Arch ]; then
                # CI 只收集软件包，不需要把产物安装进一次性构建容器。
                # INSTALL=0 也会跳过上游脚本中写 /etc/environment 的安装后配置。
                su -s /bin/bash anland -c "cd /tmp/anland/$(dirname "$BUILD_SCRIPT") && INSTALL=0 WORKDIR=/tmp/kde-packages ./$(basename "$BUILD_SCRIPT") --noconfirm"
                chmod -R a+rwX /tmp/kde-packages
              elif [ "$BUILD_TARGET" = Fedora44 ]; then
                useradd -m -s /bin/bash anland
                printf 'anland ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/anland-dnf
                chmod 0440 /etc/sudoers.d/anland-dnf
                chown -R anland:anland /tmp/anland /tmp/kde-packages
                runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
                  ANLAND_INSTALL=0 ANLAND_LOCK_PACKAGES=0 BUILD_XWAYLAND=1 \
                  WORKDIR=/tmp/kde-packages bash "/tmp/anland/$BUILD_SCRIPT"
                chmod -R a+rX /tmp/kde-packages
              else
                cd "/tmp/anland/$(dirname "$BUILD_SCRIPT")"
                WORKDIR=/root/kde-packages sudo -E "./$(basename "$BUILD_SCRIPT")"
              fi

              # 从主 kwin 包读取上游版本；不要把发行版打包修订号放进资产名。
              kwin_package=""
              kwin_version=""
              case "$BUILD_TARGET" in
                Debian13|ubuntu2604)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-wayland_*.deb' -print | sort | head -n1)"
                  if [ -z "$kwin_package" ]; then
                    kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-x11_*.deb' -print | sort | head -n1)"
                  fi
                  [ -n "$kwin_package" ] || { echo "未找到 kwin deb 包" >&2; exit 1; }
                  kwin_version="$(dpkg-deb -f "$kwin_package" Version)"
                  ;;
                Fedora43|Fedora44)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.rpm' -print | sort | head -n1)"
                  [ -n "$kwin_package" ] || { echo "未找到 kwin rpm 包" >&2; exit 1; }
                  kwin_version="$(rpm -qp --queryformat '%{VERSION}' "$kwin_package")"
                  ;;
                Arch)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.pkg.tar.*' \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' -o -name '*.pkg.tar.gz' \) -print | sort | head -n1)"
                  [ -n "$kwin_package" ] || { echo "未找到 kwin Arch 包" >&2; exit 1; }
                  kwin_version="$(pacman -Qp "$kwin_package" | awk 'NR == 1 { print $2 }')"
                  ;;
              esac
              # 去掉 epoch 和发行版/Arch 的 pkgrel，只保留 KWin 上游版本。
              kwin_version="${kwin_version#*:}"
              case "$BUILD_TARGET" in
                Debian13|ubuntu2604|Arch) kwin_version="${kwin_version%-*}" ;;
              esac
              [ -n "$kwin_version" ] || { echo "无法解析 KWin 版本" >&2; exit 1; }
              printf '%s\n' "$kwin_version" > /tmp/kde-packages/.kwin-version
          ANLAND_BUILD

      - name: 打包发布资产
        id: package
        env:
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          ASSET_PREFIX: ${{ steps.target.outputs.asset_prefix }}
          ASSET_ARCH: ${{ steps.target.outputs.asset_arch }}
          ARCHIVE_TARGET: ${{ steps.target.outputs.archive_target }}
          OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/anland-kde-packages/$ARCHIVE_TARGET"
          asset_dir="$GITHUB_WORKSPACE/.release-assets/$BUILD_TARGET"
          mkdir -p "$asset_dir"
          python3 scripts/package-artifacts.py collect --target "$BUILD_TARGET" --recursive \
            --destination "$package_dir" --exclude '*debug*' --exclude '*dbgsym*' \
            --exclude 'kwin-dev_*' --exclude 'kwin-devel-*' --exclude 'kwin-doc-*' \
            --exclude 'xorg-x11-server-Xwayland-devel-*' \
            "$OUTPUT_DIR/kwin" "$OUTPUT_DIR/xwayland" "$OUTPUT_DIR/xorg-x11-server-Xwayland" \
            "$OUTPUT_DIR/packages" "$OUTPUT_DIR"
          kwin_version="$(tr -d '[:space:]' < "$OUTPUT_DIR/.kwin-version")"
          case "$kwin_version" in ''|*[!A-Za-z0-9.+~_-]*) echo 'Invalid upstream version' >&2; exit 1 ;; esac
          asset_name="${ASSET_PREFIX}${kwin_version}-${ASSET_ARCH}.tar.gz"
          asset_path="$asset_dir/$asset_name"
          tar --mtime="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -C "$RUNNER_TEMP" -czf "$asset_path" "anland-kde-packages/$ARCHIVE_TARGET"
          python3 scripts/package-artifacts.py verify-archive --target "$BUILD_TARGET" "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
      - name: 上传发布资产
        uses: actions/upload-artifact@v6
        with:
          name: anland-kde-package-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 1

  release-kde:
    name: 更新 Anland KDE 滚动发布
    needs: [prepare-kde, build-kde]
    if: ${{ always() && !cancelled() && needs.prepare-kde.result == 'success' }}
    runs-on: ubuntu-26.04
    # 固定发布会被原地重写，必须串行更新。三条流水线各自独立分组，
    # 因此 KDE 的发布排队时不会阻塞 GNOME 与 session 的发布。
    concurrency:
      group: anland-kde-package-release
      cancel-in-progress: false
    steps:
      - name: 检出安装脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 确保滚动标签存在
        shell: bash
        run: |
          set -euo pipefail
          tag="anland-kde-packages"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已存在。"
          elif git tag "$tag" "$GITHUB_SHA" && \
              git push origin "refs/tags/${tag}"; then
            echo "已创建滚动标签 ${tag}。"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已由并发任务创建。"
          else
            echo "无法确认或创建滚动标签 ${tag}。" >&2
            exit 1
          fi

      - name: 下载软件包资产
        if: ${{ always() }}
        uses: actions/download-artifact@v7
        with:
          pattern: anland-kde-package-*
          path: release-assets
          merge-multiple: true

      - name: 创建固定发布与软件包清单
        env:
          GH_TOKEN: ${{ github.token }}
          ANLAND_REPO: ${{ inputs.kde_repo || 'https://github.com/sjszero/anland.git' }}
          ANLAND_REF: ${{ inputs.kde_ref || 'legacy' }}
          ANLAND_COMMIT: ${{ needs.prepare-kde.outputs.anland_commit }}
          BUILD_TARGET_INPUT: ${{ inputs.kde_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$release_dir"
          rolling_release_tag="anland-kde-packages"
          release_targets=(Arch Debian13 ubuntu2604 Fedora43 Fedora44)
          declare -A asset_by_target=()
          declare -A asset_time_by_target=()
          declare -A asset_source_by_target=()
          updated_targets=()
          reused_targets=()
          build_time="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          asset_prefix_for_target() {
            case "$1" in
              Arch) printf '%s\n' 'anland-kde-arch-kwin-' ;;
              Debian13) printf '%s\n' 'anland-kde-debian13-kwin-' ;;
              ubuntu2604) printf '%s\n' 'anland-kde-ubuntu2604-kwin-' ;;
              Fedora43) printf '%s\n' 'anland-kde-fedora43-kwin-' ;;
              Fedora44) printf '%s\n' 'anland-kde-fedora44-kwin-' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          target_label() {
            case "$1" in
              Arch) printf '%s\n' 'Arch Linux' ;;
              Debian13) printf '%s\n' 'Debian 13' ;;
              ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
              Fedora43) printf '%s\n' 'Fedora 43' ;;
              Fedora44) printf '%s\n' 'Fedora 44' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          asset_arch_for_target() {
            case "$1" in
              Arch|Fedora43|Fedora44) printf '%s\n' 'aarch64' ;;
              Debian13|ubuntu2604) printf '%s\n' 'arm64' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          archive_target_for_target() {
            case "$1" in
              Arch) printf '%s\n' 'arch' ;;
              Debian13) printf '%s\n' 'debian13' ;;
              ubuntu2604) printf '%s\n' 'ubuntu2604' ;;
              Fedora43) printf '%s\n' 'fedora43' ;;
              Fedora44) printf '%s\n' 'fedora44' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          local_asset_for_target() {
            local target="$1"
            local prefix arch
            local path
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            while IFS= read -r path; do
              candidates+=("${path##*/}")
            done < <(find "$release_dir" -maxdepth 1 -type f -name "${prefix}*-${arch}.tar.gz" -print | sort)
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "资产前缀 ${prefix} 在本次构建中应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 0 ]; then
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          release_assets_tag=""
          release_assets=""
          load_release_assets() {
            local tag="$1"
            if [ "$release_assets_tag" = "$tag" ]; then
              return 0
            fi
            if ! release_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"; then
              return 1
            fi
            release_assets_tag="$tag"
          }

          release_asset_for_target() {
            local tag="$1"
            local target="$2"
            local prefix arch name
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            load_release_assets "$tag" || return 1
            while IFS= read -r name; do
              case "$name" in
                "${prefix}"*"-${arch}.tar.gz") candidates+=("$name") ;;
              esac
            done <<< "$release_assets"
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "发布 ${tag} 中资产前缀 ${prefix} 应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 1 ]; then
              printf '%s\n' "${candidates[0]}"
              return 0
            fi
            return 1
          }

          archive_build_time() {
            python3 scripts/package-artifacts.py archive-time --target "$2" "$1"
          }

          previous_tag=""
          previous_release_time=""
          # 固定发布有几个平台就能沿用几个；第一次构建时它还不存在，返回 1 即可。
          find_previous_release() {
            local stable_candidate

            stable_candidate="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null)" || return 1
            [ "$stable_candidate" = "$rolling_release_tag" ] || return 1
            release_assets_tag=""
            load_release_assets "$rolling_release_tag" || return 1
            previous_tag="$rolling_release_tag"
            previous_release_time="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq '.published_at // empty')" || return 1
            return 0
          }

          case "$BUILD_TARGET_INPUT" in
            all)
              selected_prefix=""
              ;;
            ubuntu2604)
              selected_prefix="$(asset_prefix_for_target ubuntu2604)"
              ;;
            Debian13)
              selected_prefix="$(asset_prefix_for_target Debian13)"
              ;;
            Fedora43)
              selected_prefix="$(asset_prefix_for_target Fedora43)"
              ;;
            Fedora44)
              selected_prefix="$(asset_prefix_for_target Fedora44)"
              ;;
            Arch)
              selected_prefix="$(asset_prefix_for_target Arch)"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          missing_targets=()
          for target in "${release_targets[@]}"; do
            if asset="$(local_asset_for_target "$target")"; then
              if ! asset_build_time="$(archive_build_time "$release_dir/$asset" "$target")"; then
                echo "本次构建资产 $asset 缺少构建时间元数据。" >&2
                exit 1
              fi
              asset_by_target["$target"]="$asset"
              asset_time_by_target["$target"]="$asset_build_time"
              asset_source_by_target["$target"]='本次构建'
              updated_targets+=("$target")
            else
              asset_status=$?
              [ "$asset_status" -eq 1 ] || exit "$asset_status"
              missing_targets+=("$target")
            fi
          done

          # 单平台选择失败时不更新滚动发布；其他平台始终从固定发布补齐。
          if [ -n "$selected_prefix" ]; then
            selected_target="$BUILD_TARGET_INPUT"
            selected_missing=false
            for target in "${missing_targets[@]}"; do
              if [ "$target" = "$selected_target" ]; then
                selected_missing=true
                break
              fi
            done
            if [ "$selected_missing" = true ]; then
              echo "选择的 ${selected_target} 构建没有生成新资产，本次不更新滚动发布。" >&2
              exit 1
            fi
          fi

          # 固定发布里有的平台就沿用，没有的（例如第一次只构建单个平台）本次先缺着，
          # 等后续构建补上，不再因为凑不齐五个平台就整体失败。
          unavailable_targets=()
          if [ "${#missing_targets[@]}" -gt 0 ]; then
            previous_dir="$RUNNER_TEMP/anland-kde-previous-assets"
            rm -rf "$previous_dir"
            mkdir -p "$previous_dir"
            find_previous_release || echo "固定发布还不存在或不可读，本次只发布已构建的平台。"

            for target in "${missing_targets[@]}"; do
              asset=""
              if [ -n "$previous_tag" ]; then
                if asset="$(release_asset_for_target "$previous_tag" "$target")"; then
                  :
                else
                  asset_status=$?
                  [ "$asset_status" -eq 1 ] || exit "$asset_status"
                  asset=""
                fi
              fi
              if [ -z "$asset" ]; then
                unavailable_targets+=("$target")
                continue
              fi
              gh release download "$previous_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir "$previous_dir"
              reused_asset="$asset"
              cp "$previous_dir/$asset" "$release_dir/$reused_asset"
              asset_by_target["$target"]="$reused_asset"
              if reused_build_time="$(archive_build_time "$release_dir/$reused_asset" "$target")"; then
                if [ "$reused_build_time" = unknown ]; then
                  asset_time_by_target["$target"]="${previous_release_time:-未知}（包未记录构建时间）"
                else
                  asset_time_by_target["$target"]="$reused_build_time（沿用）"
                fi
              else
                asset_time_by_target["$target"]="${previous_release_time:-未知}（沿用，未记录构建时间）"
              fi
              asset_source_by_target["$target"]="沿用 ${previous_tag}"
              reused_targets+=("$target")
            done
          fi

          if [ "${#updated_targets[@]}" -eq 0 ]; then
            echo "本次没有任何平台生成新资产，不更新滚动发布。" >&2
            exit 1
          fi

          if [ "${#unavailable_targets[@]}" -gt 0 ]; then
            echo "以下平台本次发布暂无软件包，等待后续构建补齐：${unavailable_targets[*]}"
          fi

          present_targets=()
          for target in "${release_targets[@]}"; do
            if [ -n "${asset_by_target[$target]+set}" ]; then
              present_targets+=("$target")
            fi
          done

          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            test -f "$release_dir/$asset"
          done

          cp scripts/tui/install-anland-kde.sh "$release_dir/install-anland-kde.sh"
          chmod +x "$release_dir/install-anland-kde.sh"
          {
            printf 'format=1\n'
            printf 'release_tag=%s\n' "$rolling_release_tag"
            printf 'revision=run-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'generated_at=%s\n' "$build_time"
            for target in "${present_targets[@]}"; do
              archive_target="$(archive_target_for_target "$target")"
              printf '%s=%s\n' "$archive_target" "${asset_by_target[$target]}"
              printf '%s_sha256=%s\n' "$archive_target" \
                "$(sha256sum "$release_dir/${asset_by_target[$target]}" | awk '{print $1}')"
            done
          } > "$release_dir/anland-kde-manifest"

          format_target_list() {
            local target text=""
            for target in "$@"; do
              text="${text}${text:+、}$(target_label "$target")"
            done
            printf '%s\n' "${text:-无}"
          }

          updated_target_list="$(format_target_list "${updated_targets[@]}")"
          reused_target_list="$(format_target_list "${reused_targets[@]}")"
          unavailable_target_list="$(format_target_list "${unavailable_targets[@]}")"
          if [ "${#reused_targets[@]}" -eq 0 ] && [ "${#unavailable_targets[@]}" -eq 0 ]; then
            replacement_note="本次构建重新生成全部五个平台的软件包。"
          else
            replacement_note="本次替换：${updated_target_list}"
            if [ "${#reused_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；沿用 ${previous_tag}：${reused_target_list}"
            fi
            if [ "${#unavailable_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；本次发布暂无：${unavailable_target_list}"
            fi
            replacement_note="${replacement_note}。"
          fi

          release_tag="$rolling_release_tag"
          release_asset_table="$(printf '%s\n' \
            '| 压缩包 | 目标系统 | 构建时间 |' \
            '| --- | --- | --- |')"
          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            asset_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${asset}"
            release_asset_table="${release_asset_table}"$'\n'"| [\`${asset}\`](${asset_url}) | $(target_label "$target") | ${asset_time_by_target[$target]} |"
          done
          release_source_list=""
          for target in "${present_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：${asset_source_by_target[$target]}"
          done
          for target in "${unavailable_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：本次发布暂无软件包，等待后续构建补齐"
          done
          release_notes="$(printf '%s\n' \
            '# Anland KDE Wayland 预编译包' \
            '' \
            '这是供 Droidspaces Wayland RootFS 使用的固定滚动 ARM64/aarch64 软件包发布。每次更新只替换本次成功的平台，其他平台资产保持不变；尚未构建过的平台会在后续构建中补齐。' \
            '' \
            '## 发布资产' \
            '' \
            "$release_asset_table" \
            '' \
            '压缩包文件名中的 `kwin-版本` 来自该发行版实际生成的 KWin 包；不同发行版的版本可以不同。' \
            '' \
            '每个压缩包只包含对应系统中已修补的 KWin/Xwayland 软件包；`anland-kde-manifest` 精确映射目标系统到资产。' \
            '' \
            '## 构建详情' \
            '' \
            "- 构建目标：${BUILD_TARGET_INPUT}" \
            "- ${replacement_note}" \
            "- 发布生成时间：${build_time}" \
            '- 构建时间取自压缩包内的构建元数据；缺失时显示固定发布的时间。' \
            "- 软件包工作流运行号：${GITHUB_RUN_ID}" \
            "- 本次构建源码（仅更新资产）：\`${ANLAND_REPO}\` @ \`${ANLAND_COMMIT}\`（请求：\`${ANLAND_REF}\`）" \
            "- 工作流提交：\`${GITHUB_SHA}\`" \
            '- 架构：仅 ARM64/aarch64' \
            '' \
            '## 资产来源' \
            "$release_source_list" \
            '')"
          # 先备份当前滚动发布；原地重写失败时恢复原资产，避免丢失可用软件包。
          rollback_dir="$RUNNER_TEMP/anland-kde-rolling-backup"
          release_mutated=false
          release_exists=false
          rm -rf "$rollback_dir"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            mkdir -p "$rollback_dir"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$rollback_dir"
          fi

          asset_matches_target() {
            local target="$1"
            local name="$2"
            local prefix arch legacy
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            case "$target" in
              Arch) legacy='anland-kde-arch-aarch64.tar.gz' ;;
              Debian13) legacy='anland-kde-debian13-arm64.tar.gz' ;;
              ubuntu2604) legacy='anland-kde-ubuntu2604-arm64.tar.gz' ;;
              Fedora43) legacy='anland-kde-fedora43-aarch64.tar.gz' ;;
              Fedora44) legacy='anland-kde-fedora44-aarch64.tar.gz' ;;
              *) return 1 ;;
            esac
            case "$name" in
              "${prefix}"*"-${arch}.tar.gz"|"$legacy") return 0 ;;
              *) return 1 ;;
            esac
          }

          delete_stale_target_assets() {
            local target="$1"
            local desired="$2"
            local asset_rows asset_id asset_name
            asset_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 1
            while IFS=$'\t' read -r asset_id asset_name; do
              [ -n "$asset_id" ] || continue
              if asset_matches_target "$target" "$asset_name" && [ "$asset_name" != "$desired" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done <<< "$asset_rows"
          }

          delete_release_asset_named() {
            local asset_name="$1"
            local asset_ids asset_id
            asset_ids="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq ".assets[] | select(.name == \"$asset_name\") | .id")" || return 1
            while IFS= read -r asset_id; do
              [ -n "$asset_id" ] || continue
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done <<< "$asset_ids"
          }

          restore_rollback_assets() {
            local rollback_asset rollback_name current_rows current_id current_name

            # 先恢复软件包和安装脚本，最后上传旧清单，确保它不会指向尚未恢复的资产。
            for rollback_asset in "$rollback_dir"/*; do
              rollback_name="${rollback_asset##*/}"
              [ "$rollback_name" = 'anland-kde-manifest' ] && continue
              gh release upload "$release_tag" "$rollback_asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber || echo "恢复资产失败：$rollback_name" >&2
            done
            if [ -f "$rollback_dir/anland-kde-manifest" ]; then
              gh release upload "$release_tag" "$rollback_dir/anland-kde-manifest" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber || echo '恢复软件包清单失败。' >&2
            fi

            # 尽力删除多余资产；删除失败最多留下未引用资产，不能影响上一版发布的可用性。
            current_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 0
            while IFS=$'\t' read -r current_id current_name; do
              [ -n "$current_id" ] || continue
              if [ ! -f "$rollback_dir/$current_name" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$current_id" || \
                  echo "未能删除恢复后的多余资产：$current_name" >&2
              fi
            done <<< "$current_rows"
          }

          restore_previous_release() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$release_mutated" = true ] && [ -d "$rollback_dir" ]; then
              echo "滚动发布原地更新失败，尝试恢复旧资产..." >&2
              set +e
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                restore_rollback_assets
              else
                gh release create "$release_tag" "$rollback_dir"/* \
                  --draft \
                  --latest=false \
                  --target "$GITHUB_SHA" \
                  --title 'Anland KDE Wayland 预编译包' \
                  --notes '自动恢复：本次滚动发布更新失败，已恢复上一份可用资产。'
                gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
              fi
              set -e
            fi
            exit "$status"
          }
          trap restore_previous_release EXIT

          if [ "$release_exists" = true ]; then
            release_mutated=true
            updated_uploads=()
            for target in "${updated_targets[@]}"; do
              updated_uploads+=("$release_dir/${asset_by_target[$target]}")
            done
            gh release upload "$release_tag" "${updated_uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$release_dir/install-anland-kde.sh" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$release_dir/anland-kde-manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            delete_release_asset_named 'SHA256SUMS'
            for target in "${updated_targets[@]}"; do
              delete_stale_target_assets "$target" "${asset_by_target[$target]}"
            done
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Anland KDE Wayland 预编译包' \
              --notes "$release_notes" \
              --draft=false \
              --latest=false
          else
            gh release create "$release_tag" "$release_dir"/* \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title 'Anland KDE Wayland 预编译包' \
              --notes "$release_notes"
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          release_mutated=false
          trap - EXIT

          echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag"

      - name: 同步到 CNB 国内镜像
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_cnb }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: bash scripts/publish-cnb-release.sh anland-kde-packages

  # ==========================================================================
  # Anland GNOME Wayland（Mutter + patched Xwayland）
  # ==========================================================================
  prepare-gnome:
    name: 解析 Anland GNOME 源码版本
    needs: select
    if: ${{ needs.select.outputs.gnome == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 生成构建矩阵
        id: targets
        env:
          BUILD_TARGET_INPUT: ${{ inputs.gnome_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET_INPUT" in
            all)
              targets='["ubuntu2604","Debian13","Fedora43","Fedora44","Arch"]'
              ;;
            ubuntu2604|Debian13|Fedora43|Fedora44|Arch)
              targets="[\"$BUILD_TARGET_INPUT\"]"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "构建目标：$targets"

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 将请求的源解析为单个提交
        id: resolve
        env:
          ANLAND_REPO: ${{ inputs.gnome_repo || 'https://github.com/sjszero/anland.git' }}
          ANLAND_REF: ${{ inputs.gnome_ref || 'legacy' }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(mktemp -d)/anland"
          trap 'rm -rf "${source_dir%/anland}"' EXIT
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
          anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
          echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
          echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"

  build-gnome:
    name: 构建 GNOME ${{ matrix.target }} 软件包
    needs: prepare-gnome
    runs-on: ubuntu-24.04-arm
    # 单个平台失败不阻止其余软件包和发布合并；发布阶段会复用上一版该平台资产。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-gnome.outputs.targets) }}

    env:
      ANLAND_REPO: ${{ inputs.gnome_repo || 'https://github.com/sjszero/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-gnome.outputs.anland_commit }}
      BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: 检出云编译产物收集脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: 解析构建目标
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET" in
            ubuntu2604)
              image=ubuntu:26.04
              script=producers/gnome/Ubuntu2604_v5/build.sh
              xwayland_patch=producers/kde/ubuntu2604_v5/xwayland.patch
              package_pattern='*.deb'
              asset_prefix=anland-gnome-ubuntu2604-mutter-
              asset_arch=arm64
              archive_target=ubuntu2604
              ;;
            Debian13)
              image=debian:trixie
              script=producers/gnome/Debian13_v5/build.sh
              xwayland_patch=producers/kde/Debian13_v5/xwayland.patch
              package_pattern='*.deb'
              asset_prefix=anland-gnome-debian13-mutter-
              asset_arch=arm64
              archive_target=debian13
              ;;
            Fedora43)
              image=fedora:43
              script=producers/gnome/Fedora43_v5/build.sh
              xwayland_patch=''
              package_pattern='*.rpm'
              asset_prefix=anland-gnome-fedora43-mutter-
              asset_arch=aarch64
              archive_target=fedora43
              ;;
            Fedora44)
              image=fedora:44
              script=producers/gnome/Fedora44_v5/build.sh
              xwayland_patch=''
              package_pattern='*.rpm'
              asset_prefix=anland-gnome-fedora44-mutter-
              asset_arch=aarch64
              archive_target=fedora44
              ;;
            Arch)
              image=ogarcia/archlinux:latest
              script=producers/gnome/Arch_v5/build.sh
              xwayland_patch=''
              package_pattern='*.pkg.tar.*'
              asset_prefix=anland-gnome-arch-mutter-
              asset_arch=aarch64
              archive_target=arch
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET" >&2
              exit 1
              ;;
          esac

          {
            echo "image=$image"
            echo "script=$script"
            echo "xwayland_patch=$xwayland_patch"
            echo "package_pattern=$package_pattern"
            echo "asset_prefix=$asset_prefix"
            echo "asset_arch=$asset_arch"
            echo "archive_target=$archive_target"
          } >> "$GITHUB_OUTPUT"

      - name: 在 Fedora ARM64 中构建（匹配发行版源码和 ABI）
        if: ${{ matrix.target == 'Fedora43' || matrix.target == 'Fedora44' }}
        env:
          WM: gnome
          FEDORA_VERSION: ${{ matrix.target == 'Fedora44' && '44' || '43' }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/.gnome-package-build/$BUILD_TARGET"
          mkdir -p "$output_dir"
          docker run --rm -i --platform linux/arm64 \
            -e WM -e ANLAND_REPO -e ANLAND_COMMIT -e FEDORA_VERSION \
            -v "$output_dir:/output" "fedora:$FEDORA_VERSION" bash -s <<'FEDORA_BUILD' 2>&1 | tee "$output_dir/build.log"
          set -euo pipefail
          : "${WM:?}" "${ANLAND_REPO:?}" "${ANLAND_COMMIT:?}"
          case "$WM" in denial|gnome|hyprland|mango|niri) ;; *) echo "Unknown WM: $WM" >&2; exit 1 ;; esac
          [[ $(uname -m) == aarch64 && $(id -u) == 0 ]] || { echo 'requires an ARM64 Fedora CI container' >&2; exit 1; }
          source /etc/os-release
          [[ $ID == fedora && $VERSION_ID == "$FEDORA_VERSION" ]] || exit 1
          dnf --setopt=install_weak_deps=False install -y git-core ca-certificates curl sudo \
              python3 util-linux rpm-build rpmdevtools dnf5-plugins tar xz findutils shadow-utils
          useradd -m -s /bin/bash anland
          printf 'anland ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/anland-dnf
          chmod 0440 /etc/sudoers.d/anland-dnf
          source_dir=/home/anland/.cache/anland-source
          mkdir -p "$source_dir"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          [[ $(git -C "$source_dir" rev-parse HEAD) == "$ANLAND_COMMIT" ]]
          recipe="$source_dir/producers/$WM/Fedora${FEDORA_VERSION}_v5"
          test -s "$recipe/dependencies.lock"
          for script in build.sh startup.sh; do bash -n "$recipe/$script"; done
          chown -R anland:anland /home/anland
          mkdir -p /output
          output_owner=$(stat -c '%u:%g' /output)
          restore_output_owner() {
              local build_rc=$?
              trap - EXIT
              if ! chown -Rh -- "$output_owner" /output; then
                  printf 'Failed to restore output ownership to %s\n' "$output_owner" >&2
                  if [[ $build_rc == 0 ]]; then build_rc=1; fi
              fi
              exit "$build_rc"
          }
          trap restore_output_owner EXIT
          chown anland:anland /output
          runuser -u anland -- env HOME=/home/anland JOBS="$(nproc)" \
              ANLAND_INSTALL=0 ANLAND_STAGE=build ANLAND_WITH_DEPS=1 ANLAND_OFFLINE=0 \
              ANLAND_ENGINE_MODE=auto ANLAND_WITH_DE=1 \
              WORKDIR="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5" \
              ARTIFACTS_DIR=/output/artifacts bash "$recipe/build.sh"
          cd /output/artifacts
          package_list="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/packages.list"
          checksums="/home/anland/.cache/anland-$WM-fedora${FEDORA_VERSION}-v5/SHA256SUMS"
          [[ -s $package_list ]] || package_list=/output/artifacts/packages.list
          [[ -s $checksums ]] || checksums=/output/artifacts/SHA256SUMS
          test -s "$package_list"
          sha256sum -c "$checksums"
          found=()
          while IFS= read -r package; do
              [[ $package == "${package##*/}" && $package == *.rpm && -s $package ]]
              architecture=$(rpm -qp --qf '%{ARCH}' "$package")
              [[ $architecture == aarch64 || $architecture == noarch ]]
              rpm -K "$package"
              found+=("$(rpm -qp --qf '%{NAME}' "$package")")
          done < "$package_list"
          actual=$(printf '%s\n' "${found[@]}" | sort)
          case "$WM" in
              mango) expected=$(printf '%s\n' mango-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
              hyprland) expected=$(printf '%s\n' hyprland-anland xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
              denial) expected=$(printf '%s\n' denial-anland-engine denial denial-desktop xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
              niri) expected=$(printf '%s\n' niri-anland xwayland-satellite xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
              gnome) expected=$(printf '%s\n' mutter mutter-common mutter-devel xorg-x11-server-Xwayland xorg-x11-server-Xwayland-devel | sort) ;;
          esac
          [[ $actual == "$expected" ]] || { printf 'Incomplete Fedora package set:\n%s\nExpected:\n%s\n' "$actual" "$expected" >&2; exit 1; }
          chmod -R a+rX /output/artifacts
          printf 'RUNNER_BUILD_ARTIFACTS_OK WM=%s DISTRO=fedora%s COMMIT=%s\n' "$WM" "$FEDORA_VERSION" "$ANLAND_COMMIT"
          FEDORA_BUILD
          docker run --rm -v "$output_dir:/output:ro" "fedora:$FEDORA_VERSION" \
            bash -c 'for f in /output/artifacts/mutter-*.rpm; do [ "$(rpm -qp --qf "%{NAME}" "$f")" != mutter ] || rpm -qp --qf "%{VERSION}\n" "$f"; done' \
            > "$output_dir/.mutter-version"
          test -s "$output_dir/.mutter-version"
      - name: 在对应的发行版中构建软件包
        if: ${{ matrix.target != 'Fedora43' && matrix.target != 'Fedora44' }}
        env:
          DISTRO_IMAGE: ${{ steps.target.outputs.image }}
          BUILD_SCRIPT: ${{ steps.target.outputs.script }}
          XWAYLAND_PATCH: ${{ steps.target.outputs.xwayland_patch }}
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          OUTPUT_DIR: .gnome-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          docker run --rm -i \
            --platform linux/arm64 \
            -e ANLAND_REPO \
            -e ANLAND_COMMIT \
            -e BUILD_SCRIPT \
            -e BUILD_TARGET \
            -e XWAYLAND_PATCH \
            -e PKG_PATTERN \
            -v "$PWD/$OUTPUT_DIR:/packages" \
            "$DISTRO_IMAGE" \
            bash -s <<'ANLAND_BUILD'
              set -euo pipefail

              case "$BUILD_TARGET" in
                Arch)
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm --needed base-devel git ca-certificates sudo
                  id -u anland >/dev/null 2>&1 || useradd -m -s /bin/bash anland
                  printf "anland ALL=(root) NOPASSWD: /usr/bin/pacman\n" > /etc/sudoers.d/anland-pacman
                  chmod 0440 /etc/sudoers.d/anland-pacman
                  if grep -q "^#PACMAN_AUTH=()" /etc/makepkg.conf; then
                    sed -i "s/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/" /etc/makepkg.conf
                  else
                    printf "\nPACMAN_AUTH=(sudo)\n" >> /etc/makepkg.conf
                  fi
                  chown -R anland:anland /packages
                  ;;
                ubuntu2604|Debian13)
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    git ca-certificates curl sudo \
                    build-essential devscripts dpkg-dev fakeroot patch
                  ;;
                *)
                  echo "不支持的构建目标：$BUILD_TARGET" >&2
                  exit 1
                  ;;
              esac

              git init --quiet /tmp/anland
              git -C /tmp/anland remote add origin "$ANLAND_REPO"
              git -C /tmp/anland fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
              git -C /tmp/anland checkout --quiet --detach FETCH_HEAD

              test -f "/tmp/anland/$BUILD_SCRIPT"
              chmod +x "/tmp/anland/$BUILD_SCRIPT"

              case "$BUILD_TARGET" in
                Arch)
                  su -s /bin/bash anland -c "cd /tmp/anland/$(dirname "$BUILD_SCRIPT") && ANLAND_INSTALL=0 WORKDIR=/packages ./$(basename "$BUILD_SCRIPT") --noconfirm"
                  chmod -R a+rX /packages
                  mutter_package=""
                  while IFS= read -r package; do
                    if [ "$(LC_ALL=C pacman -Qp "$package" | awk 'NR == 1 { print $1 }')" = mutter ]; then
                      mutter_package="$package"
                      break
                    fi
                  done < <(find /packages/packages -maxdepth 1 -type f -name '*.pkg.tar.*' \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' -o -name '*.pkg.tar.gz' \) -print | sort)
                  [ -n "$mutter_package" ] || { echo "未找到 Mutter pacman 包" >&2; exit 1; }
                  mutter_package_version="$(LC_ALL=C pacman -Qp "$mutter_package" | awk 'NR == 1 { print $2 }')"
                  mutter_version="${mutter_package_version#*:}"
                  mutter_version="${mutter_version%-*}"
                  [ -n "$mutter_version" ] || { echo "无法解析 Mutter 版本" >&2; exit 1; }
                  printf '%s\n' "$mutter_version" > /packages/.mutter-version
                  ;;
                ubuntu2604|Debian13)
                  test -f "/tmp/anland/$XWAYLAND_PATCH"
                  # Debian 13 使用 DEB822 源；上游构建脚本要求 deb-src。
                  if [ "$BUILD_TARGET" = Debian13 ] && [ -f /etc/apt/sources.list.d/debian.sources ]; then
                    sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
                    apt-get update
                  fi
                  cd "/tmp/anland/$(dirname "$BUILD_SCRIPT")"
                  XWAYLAND_PATCH="/tmp/anland/$XWAYLAND_PATCH" \
                    WORKDIR=/packages \
                    sudo -E "./$(basename "$BUILD_SCRIPT")"

                  # 从主 mutter 包读取上游版本；不要把发行版打包修订号放进资产名。
                  mutter_package=""
                  while IFS= read -r package; do
                    if [ "$(dpkg-deb -f "$package" Package)" = mutter ]; then
                      mutter_package="$package"
                      break
                    fi
                  done < <(find /packages/mutter -maxdepth 1 -type f -name '*.deb' -print | sort)
                  [ -n "$mutter_package" ] || { echo "未找到 mutter deb 包" >&2; exit 1; }
                  mutter_version="$(dpkg-deb -f "$mutter_package" Version)"
                  # 去掉 epoch 和 Debian/Ubuntu 打包修订号，只保留 Mutter 上游版本。
                  mutter_version="${mutter_version#*:}"
                  mutter_version="${mutter_version%-*}"
                  [ -n "$mutter_version" ] || { echo "无法解析 Mutter 版本" >&2; exit 1; }
                  printf '%s\n' "$mutter_version" > /packages/.mutter-version
                  chmod -R a+rX /packages
                  ;;
              esac
          ANLAND_BUILD

      - name: 打包发布资产
        id: package
        env:
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          ASSET_PREFIX: ${{ steps.target.outputs.asset_prefix }}
          ASSET_ARCH: ${{ steps.target.outputs.asset_arch }}
          ARCHIVE_TARGET: ${{ steps.target.outputs.archive_target }}
          OUTPUT_DIR: .gnome-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/anland-gnome-packages/$ARCHIVE_TARGET"
          asset_dir="$GITHUB_WORKSPACE/.release-assets/$BUILD_TARGET"
          mkdir -p "$asset_dir"
          python3 scripts/package-artifacts.py collect --target "$BUILD_TARGET" --recursive \
            --destination "$package_dir" --exclude '*debug*' --exclude '*dbgsym*' \
            --exclude 'libmutter-*-dev_*' --exclude 'mutter-doc_*' --exclude 'mutter-tests_*' \
            --exclude 'mutter-devkit-*' --exclude 'mutter-docs-*' "$OUTPUT_DIR"
          if [ "$BUILD_TARGET" = Arch ]; then
            shopt -s nullglob
            packages=("$package_dir"/*)
            [[ ${#packages[@]} == 2 ]]
            [[ -n $(find "$package_dir" -maxdepth 1 -type f -name 'mutter-[0-9]*.pkg.tar.*' -print -quit) ]]
            [[ -n $(find "$package_dir" -maxdepth 1 -type f -name 'xorg-xwayland-*.pkg.tar.*' -print -quit) ]]
          fi
          mutter_version="$(tr -d '[:space:]' < "$OUTPUT_DIR/.mutter-version")"
          case "$mutter_version" in ''|*[!A-Za-z0-9.+~_-]*) echo 'Invalid upstream version' >&2; exit 1 ;; esac
          asset_name="${ASSET_PREFIX}${mutter_version}-${ASSET_ARCH}.tar.gz"
          asset_path="$asset_dir/$asset_name"
          tar --mtime="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -C "$RUNNER_TEMP" -czf "$asset_path" "anland-gnome-packages/$ARCHIVE_TARGET"
          python3 scripts/package-artifacts.py verify-archive --target "$BUILD_TARGET" "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
      - name: 上传发布资产
        uses: actions/upload-artifact@v6
        with:
          name: anland-gnome-package-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 1

  release-gnome:
    name: 更新 Anland GNOME 滚动发布
    needs: [prepare-gnome, build-gnome]
    if: ${{ always() && !cancelled() && needs.prepare-gnome.result == 'success' }}
    runs-on: ubuntu-26.04
    # 固定发布会被原地重写，必须串行更新。三条流水线各自独立分组，
    # 因此 GNOME 的发布排队时不会阻塞 KDE 与 session 的发布。
    concurrency:
      group: anland-gnome-package-release
      cancel-in-progress: false
    steps:
      - name: 检出安装脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 确保滚动标签存在
        shell: bash
        run: |
          set -euo pipefail
          tag="anland-gnome-packages"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已存在。"
          elif git tag "$tag" "$GITHUB_SHA" && \
              git push origin "refs/tags/${tag}"; then
            echo "已创建滚动标签 ${tag}。"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已由并发任务创建。"
          else
            echo "无法确认或创建滚动标签 ${tag}。" >&2
            exit 1
          fi

      - name: 下载软件包资产
        if: ${{ always() }}
        uses: actions/download-artifact@v7
        with:
          pattern: anland-gnome-package-*
          path: release-assets
          merge-multiple: true

      - name: 创建固定发布与软件包清单
        env:
          GH_TOKEN: ${{ github.token }}
          ANLAND_REPO: ${{ inputs.gnome_repo || 'https://github.com/sjszero/anland.git' }}
          ANLAND_REF: ${{ inputs.gnome_ref || 'legacy' }}
          ANLAND_COMMIT: ${{ needs.prepare-gnome.outputs.anland_commit }}
          BUILD_TARGET_INPUT: ${{ inputs.gnome_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$release_dir"
          rolling_release_tag="anland-gnome-packages"
          release_targets=(Debian13 ubuntu2604 Fedora43 Fedora44 Arch)
          declare -A asset_by_target=()
          declare -A asset_time_by_target=()
          declare -A asset_source_by_target=()
          updated_targets=()
          reused_targets=()
          build_time="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          asset_prefix_for_target() {
            case "$1" in
              Debian13) printf '%s\n' 'anland-gnome-debian13-mutter-' ;;
              ubuntu2604) printf '%s\n' 'anland-gnome-ubuntu2604-mutter-' ;;
              Fedora43) printf '%s\n' 'anland-gnome-fedora43-mutter-' ;;
              Fedora44) printf '%s\n' 'anland-gnome-fedora44-mutter-' ;;
              Arch) printf '%s\n' 'anland-gnome-arch-mutter-' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          target_label() {
            case "$1" in
              Debian13) printf '%s\n' 'Debian 13' ;;
              ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
              Fedora43) printf '%s\n' 'Fedora 43' ;;
              Fedora44) printf '%s\n' 'Fedora 44' ;;
              Arch) printf '%s\n' 'Arch Linux ARM' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          asset_arch_for_target() {
            case "$1" in
              Debian13|ubuntu2604) printf '%s\n' 'arm64' ;;
              Fedora43|Fedora44|Arch) printf '%s\n' 'aarch64' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          archive_target_for_target() {
            case "$1" in
              Debian13) printf '%s\n' 'debian13' ;;
              ubuntu2604) printf '%s\n' 'ubuntu2604' ;;
              Fedora43) printf '%s\n' 'fedora43' ;;
              Fedora44) printf '%s\n' 'fedora44' ;;
              Arch) printf '%s\n' 'arch' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          local_asset_for_target() {
            local target="$1"
            local prefix arch
            local path
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            while IFS= read -r path; do
              candidates+=("${path##*/}")
            done < <(find "$release_dir" -maxdepth 1 -type f -name "${prefix}*-${arch}.tar.gz" -print | sort)
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "资产前缀 ${prefix} 在本次构建中应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 0 ]; then
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          release_assets_tag=""
          release_assets=""
          load_release_assets() {
            local tag="$1"
            if [ "$release_assets_tag" = "$tag" ]; then
              return 0
            fi
            if ! release_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"; then
              return 1
            fi
            release_assets_tag="$tag"
          }

          release_asset_for_target() {
            local tag="$1"
            local target="$2"
            local prefix arch name
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            load_release_assets "$tag" || return 1
            while IFS= read -r name; do
              case "$name" in
                "${prefix}"*"-${arch}.tar.gz") candidates+=("$name") ;;
              esac
            done <<< "$release_assets"
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "发布 ${tag} 中资产前缀 ${prefix} 应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 1 ]; then
              printf '%s\n' "${candidates[0]}"
              return 0
            fi
            return 1
          }

          archive_build_time() {
            python3 scripts/package-artifacts.py archive-time --target "$2" "$1"
          }

          previous_tag=""
          previous_release_time=""
          # 固定发布有几个平台就能沿用几个；第一次构建时它还不存在，返回 1 即可。
          find_previous_release() {
            local stable_candidate

            stable_candidate="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null)" || return 1
            [ "$stable_candidate" = "$rolling_release_tag" ] || return 1
            release_assets_tag=""
            load_release_assets "$rolling_release_tag" || return 1
            previous_tag="$rolling_release_tag"
            previous_release_time="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq '.published_at // empty')" || return 1
            return 0
          }

          case "$BUILD_TARGET_INPUT" in
            all)
              selected_prefix=""
              ;;
            ubuntu2604)
              selected_prefix="$(asset_prefix_for_target ubuntu2604)"
              ;;
            Debian13)
              selected_prefix="$(asset_prefix_for_target Debian13)"
              ;;
            Fedora43)
              selected_prefix="$(asset_prefix_for_target Fedora43)"
              ;;
            Fedora44)
              selected_prefix="$(asset_prefix_for_target Fedora44)"
              ;;
            Arch)
              selected_prefix="$(asset_prefix_for_target Arch)"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          missing_targets=()
          for target in "${release_targets[@]}"; do
            if asset="$(local_asset_for_target "$target")"; then
              if ! asset_build_time="$(archive_build_time "$release_dir/$asset" "$target")"; then
                echo "本次构建资产 $asset 缺少构建时间元数据。" >&2
                exit 1
              fi
              asset_by_target["$target"]="$asset"
              asset_time_by_target["$target"]="$asset_build_time"
              asset_source_by_target["$target"]='本次构建'
              updated_targets+=("$target")
            else
              asset_status=$?
              [ "$asset_status" -eq 1 ] || exit "$asset_status"
              missing_targets+=("$target")
            fi
          done

          # 单平台选择失败时不更新滚动发布；其他平台始终从固定发布补齐。
          if [ -n "$selected_prefix" ]; then
            selected_target="$BUILD_TARGET_INPUT"
            selected_missing=false
            for target in "${missing_targets[@]}"; do
              if [ "$target" = "$selected_target" ]; then
                selected_missing=true
                break
              fi
            done
            if [ "$selected_missing" = true ]; then
              echo "选择的 ${selected_target} 构建没有生成新资产，本次不更新滚动发布。" >&2
              exit 1
            fi
          fi

          # 固定发布里有的平台就沿用，没有的（例如第一次只构建单个平台）本次先缺着，
          # 等后续构建补上，不再因为凑不齐两个平台就整体失败。
          unavailable_targets=()
          if [ "${#missing_targets[@]}" -gt 0 ]; then
            previous_dir="$RUNNER_TEMP/anland-gnome-previous-assets"
            rm -rf "$previous_dir"
            mkdir -p "$previous_dir"
            find_previous_release || echo "固定发布还不存在或不可读，本次只发布已构建的平台。"

            for target in "${missing_targets[@]}"; do
              asset=""
              if [ -n "$previous_tag" ]; then
                if asset="$(release_asset_for_target "$previous_tag" "$target")"; then
                  :
                else
                  asset_status=$?
                  [ "$asset_status" -eq 1 ] || exit "$asset_status"
                  asset=""
                fi
              fi
              if [ -z "$asset" ]; then
                unavailable_targets+=("$target")
                continue
              fi
              gh release download "$previous_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir "$previous_dir"
              reused_asset="$asset"
              cp "$previous_dir/$asset" "$release_dir/$reused_asset"
              asset_by_target["$target"]="$reused_asset"
              if reused_build_time="$(archive_build_time "$release_dir/$reused_asset" "$target")"; then
                if [ "$reused_build_time" = unknown ]; then
                  asset_time_by_target["$target"]="${previous_release_time:-未知}（包未记录构建时间）"
                else
                  asset_time_by_target["$target"]="$reused_build_time（沿用）"
                fi
              else
                asset_time_by_target["$target"]="${previous_release_time:-未知}（沿用，未记录构建时间）"
              fi
              asset_source_by_target["$target"]="沿用 ${previous_tag}"
              reused_targets+=("$target")
            done
          fi

          if [ "${#updated_targets[@]}" -eq 0 ]; then
            echo "本次没有任何平台生成新资产，不更新滚动发布。" >&2
            exit 1
          fi

          if [ "${#unavailable_targets[@]}" -gt 0 ]; then
            echo "以下平台本次发布暂无软件包，等待后续构建补齐：${unavailable_targets[*]}"
          fi

          present_targets=()
          for target in "${release_targets[@]}"; do
            if [ -n "${asset_by_target[$target]+set}" ]; then
              present_targets+=("$target")
            fi
          done

          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            test -f "$release_dir/$asset"
          done

          cp scripts/tui/install-anland-gnome.sh "$release_dir/install-anland-gnome.sh"
          chmod +x "$release_dir/install-anland-gnome.sh"
          {
            printf 'format=1\n'
            printf 'release_tag=%s\n' "$rolling_release_tag"
            printf 'revision=run-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'generated_at=%s\n' "$build_time"
            for target in "${present_targets[@]}"; do
              archive_target="$(archive_target_for_target "$target")"
              printf '%s=%s\n' "$archive_target" "${asset_by_target[$target]}"
              printf '%s_sha256=%s\n' "$archive_target" \
                "$(sha256sum "$release_dir/${asset_by_target[$target]}" | awk '{print $1}')"
            done
          } > "$release_dir/anland-gnome-manifest"

          format_target_list() {
            local target text=""
            for target in "$@"; do
              text="${text}${text:+、}$(target_label "$target")"
            done
            printf '%s\n' "${text:-无}"
          }

          updated_target_list="$(format_target_list "${updated_targets[@]}")"
          reused_target_list="$(format_target_list "${reused_targets[@]}")"
          unavailable_target_list="$(format_target_list "${unavailable_targets[@]}")"
          if [ "${#reused_targets[@]}" -eq 0 ] && [ "${#unavailable_targets[@]}" -eq 0 ]; then
            replacement_note="本次构建重新生成全部三个平台的软件包。"
          else
            replacement_note="本次替换：${updated_target_list}"
            if [ "${#reused_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；沿用 ${previous_tag}：${reused_target_list}"
            fi
            if [ "${#unavailable_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；本次发布暂无：${unavailable_target_list}"
            fi
            replacement_note="${replacement_note}。"
          fi

          release_tag="$rolling_release_tag"
          release_asset_table="$(printf '%s\n' \
            '| 压缩包 | 目标系统 | 构建时间 |' \
            '| --- | --- | --- |')"
          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            asset_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${asset}"
            release_asset_table="${release_asset_table}"$'\n'"| [\`${asset}\`](${asset_url}) | $(target_label "$target") | ${asset_time_by_target[$target]} |"
          done
          release_source_list=""
          for target in "${present_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：${asset_source_by_target[$target]}"
          done
          for target in "${unavailable_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：本次发布暂无软件包，等待后续构建补齐"
          done
          release_notes="$(printf '%s\n' \
            '# Anland GNOME Wayland 预编译包' \
            '' \
            '这是供 Droidspaces Wayland RootFS 使用的固定滚动 ARM64 软件包发布。每次更新只替换本次成功的平台，其他平台资产保持不变；尚未构建过的平台会在后续构建中补齐。' \
            '' \
            '## 发布资产' \
            '' \
            "$release_asset_table" \
            '' \
            '压缩包文件名中的 `mutter-版本` 来自该发行版实际生成的 Mutter 包；不同发行版的版本可以不同。' \
            '' \
            '每个压缩包包含对应系统的已修补 Mutter 和 Xwayland 运行时包。anland-gnome-manifest 精确映射目标系统到资产。' \
            '' \
            '## 构建详情' \
            '' \
            "- 构建目标：${BUILD_TARGET_INPUT}" \
            "- ${replacement_note}" \
            "- 发布生成时间：${build_time}" \
            '- 构建时间取自压缩包内的构建元数据；缺失时显示固定发布的时间。' \
            "- 软件包工作流运行号：${GITHUB_RUN_ID}" \
            "- 本次构建源码（仅更新资产）：\`${ANLAND_REPO}\` @ \`${ANLAND_COMMIT}\`（请求：\`${ANLAND_REF}\`）" \
            "- 工作流提交：\`${GITHUB_SHA}\`" \
            '- 架构：仅 ARM64' \
            '' \
            '## 资产来源' \
            "$release_source_list" \
            '')"
          # 先备份当前滚动发布；原地重写失败时恢复原资产，避免丢失可用软件包。
          rollback_dir="$RUNNER_TEMP/anland-gnome-rolling-backup"
          release_mutated=false
          release_exists=false
          rm -rf "$rollback_dir"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
            mkdir -p "$rollback_dir"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$rollback_dir"
          fi

          asset_matches_target() {
            local target="$1"
            local name="$2"
            local prefix arch legacy
            prefix="$(asset_prefix_for_target "$target")"
            arch="$(asset_arch_for_target "$target")"
            case "$target" in
              Debian13) legacy='anland-gnome-debian13-arm64.tar.gz' ;;
              ubuntu2604) legacy='anland-gnome-ubuntu2604-arm64.tar.gz' ;;
              Arch) legacy='__no_legacy_arch_asset__' ;;
              *) return 1 ;;
            esac
            case "$name" in
              "${prefix}"*"-${arch}.tar.gz"|"$legacy") return 0 ;;
              *) return 1 ;;
            esac
          }

          delete_stale_target_assets() {
            local target="$1"
            local desired="$2"
            local asset_rows asset_id asset_name
            asset_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 1
            while IFS=$'\t' read -r asset_id asset_name; do
              [ -n "$asset_id" ] || continue
              if asset_matches_target "$target" "$asset_name" && [ "$asset_name" != "$desired" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done <<< "$asset_rows"
          }

          delete_release_asset_named() {
            local asset_name="$1"
            local asset_ids asset_id
            asset_ids="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq ".assets[] | select(.name == \"$asset_name\") | .id")" || return 1
            while IFS= read -r asset_id; do
              [ -n "$asset_id" ] || continue
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done <<< "$asset_ids"
          }

          restore_rollback_assets() {
            local rollback_asset rollback_name current_rows current_id current_name

            # 先恢复软件包和安装脚本，最后上传旧清单，确保它不会指向尚未恢复的资产。
            for rollback_asset in "$rollback_dir"/*; do
              rollback_name="${rollback_asset##*/}"
              [ "$rollback_name" = 'anland-gnome-manifest' ] && continue
              gh release upload "$release_tag" "$rollback_asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber || echo "恢复资产失败：$rollback_name" >&2
            done
            if [ -f "$rollback_dir/anland-gnome-manifest" ]; then
              gh release upload "$release_tag" "$rollback_dir/anland-gnome-manifest" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber || echo '恢复软件包清单失败。' >&2
            fi

            # 尽力删除多余资产；删除失败最多留下未引用资产，不能影响上一版发布的可用性。
            current_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 0
            while IFS=$'\t' read -r current_id current_name; do
              [ -n "$current_id" ] || continue
              if [ ! -f "$rollback_dir/$current_name" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$current_id" || \
                  echo "未能删除恢复后的多余资产：$current_name" >&2
              fi
            done <<< "$current_rows"
          }

          restore_previous_release() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$release_mutated" = true ] && [ -d "$rollback_dir" ]; then
              echo "滚动发布原地更新失败，尝试恢复旧资产..." >&2
              set +e
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                restore_rollback_assets
              else
                gh release create "$release_tag" "$rollback_dir"/* \
                  --draft \
                  --latest=false \
                  --target "$GITHUB_SHA" \
                  --title 'Anland GNOME Wayland 预编译包' \
                  --notes '自动恢复：本次滚动发布更新失败，已恢复上一份可用资产。'
                gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
              fi
              set -e
            fi
            exit "$status"
          }
          trap restore_previous_release EXIT

          if [ "$release_exists" = true ]; then
            release_mutated=true
            updated_uploads=()
            for target in "${updated_targets[@]}"; do
              updated_uploads+=("$release_dir/${asset_by_target[$target]}")
            done
            gh release upload "$release_tag" "${updated_uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$release_dir/install-anland-gnome.sh" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$release_dir/anland-gnome-manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            delete_release_asset_named 'SHA256SUMS'
            for target in "${updated_targets[@]}"; do
              delete_stale_target_assets "$target" "${asset_by_target[$target]}"
            done
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Anland GNOME Wayland 预编译包' \
              --notes "$release_notes" \
              --draft=false \
              --latest=false
          else
            gh release create "$release_tag" "$release_dir"/* \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title 'Anland GNOME Wayland 预编译包' \
              --notes "$release_notes"
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          release_mutated=false
          trap - EXIT

          echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag"

      - name: 同步到 CNB 国内镜像
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_cnb }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: bash scripts/publish-cnb-release.sh anland-gnome-packages

  # ==========================================================================
  # Anland Next session（发行版原生包）
  # ==========================================================================
  prepare-session:
    name: 解析 Anland Next 源码版本
    needs: select
    if: ${{ needs.select.outputs.session == 'true' }}
    runs-on: ubuntu-26.04
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 生成构建矩阵
        id: targets
        env:
          BUILD_TARGET_INPUT: ${{ inputs.session_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET_INPUT" in
            all)
              targets='["ubuntu2604","debian13","fedora43","fedora44","arch"]'
              ;;
            ubuntu2604|debian13|fedora43|fedora44|arch)
              targets="[\"$BUILD_TARGET_INPUT\"]"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "构建目标：$targets"

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 将请求的源解析为单个提交
        id: resolve
        env:
          ANLAND_REPO: ${{ inputs.session_repo || 'https://github.com/SuperTurtleDev/anland.git' }}
          ANLAND_REF: ${{ inputs.session_ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/anland-next"
          rm -rf -- "$source_dir"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
          # Every input the package builds from, including the vendored trees'
          # patches: fail here rather than five jobs later.
          for required in \
            anland-session/miniwm.c \
            anland-session/anland-session.sh \
            anland-session/anland-session.service \
            patches/bubblewrap/config.h \
            patches/bubblewrap/anland-mountinfo-index.patch \
            patches/xwayland/anland-kgsl-glamor.patch \
            LICENSE; do
            test -f "$source_dir/$required"
          done
          echo "ANLAND_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
          echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"

      - name: 检出打包项目
        uses: actions/checkout@v5

      - name: 暂存 vendored 源码(bubblewrap + Xwayland)
        shell: bash
        run: |
          set -euo pipefail
          # Staged once here rather than in each of the five build jobs: the
          # xserver submodule is a ~30 MB shallow fetch and the result does not
          # depend on the target distribution.
          bash scripts/stage-anland-session-vendor.sh "$RUNNER_TEMP/anland-vendor"

      - name: 上传 vendored 源码
        uses: actions/upload-artifact@v6
        with:
          name: anland-session-vendor
          path: ${{ runner.temp }}/anland-vendor/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  build-session:
    name: 构建 session ${{ matrix.target }} ARM64 包
    needs: prepare-session
    runs-on: ubuntu-24.04-arm
    # 单个平台失败不阻止其余软件包和发布阶段复用上一版资产。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-session.outputs.targets) }}
    container:
      image: ${{ matrix.target == 'ubuntu2604' && 'ubuntu:26.04' || matrix.target == 'debian13' && 'debian:13' || matrix.target == 'fedora43' && 'fedora:43' || matrix.target == 'fedora44' && 'fedora:44' || 'ogarcia/archlinux:latest' }}
    env:
      TARGET: ${{ matrix.target }}
      ANLAND_REPO: ${{ inputs.session_repo || 'https://github.com/SuperTurtleDev/anland.git' }}
      ANLAND_COMMIT: ${{ needs.prepare-session.outputs.anland_commit }}
      OUTPUT_DIR: out/${{ matrix.target }}
      PACKAGE_VERSION: 0.1.1
    steps:
      - name: 安装检出工具
        shell: bash
        run: |
          set -eux
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            # ports.ubuntu.com republishes its indexes in place, so an update
            # that lands mid-sync dies with "File has unexpected size ...
            # Mirror sync in progress?" — transient, and gone on the next try.
            apt-get update || { sleep 10; apt-get update; }
            apt-get install -y --no-install-recommends ca-certificates git python3
          elif command -v dnf >/dev/null; then
            dnf install -y --setopt=install_weak_deps=False ca-certificates git python3
          else
            pacman -Syu --noconfirm --needed ca-certificates git python
          fi
      - name: 检出打包项目
        uses: actions/checkout@v5

      - name: 获取并固定 Anland Next 源码
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/anland-next"
          rm -rf -- "$source_dir"
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          source_commit="$(git -C "$source_dir" rev-parse HEAD)"
          for required in \
            anland-session/miniwm.c \
            anland-session/anland-session.sh \
            anland-session/anland-session.service LICENSE; do
            test -f "$source_dir/$required"
          done
          echo "ANLAND_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "Anland Next: $ANLAND_REPO @ $source_commit"

      - name: 下载 vendored 源码
        uses: actions/download-artifact@v7
        with:
          name: anland-session-vendor
          path: ${{ runner.temp }}/anland-vendor

      - name: 构建、安装并验证原生包
        shell: bash
        env:
          ANLAND_VENDOR_DIR: ${{ runner.temp }}/anland-vendor
        run: |
          set -euo pipefail
          chmod +x scripts/build-anland-session-package.sh
          bash scripts/build-anland-session-package.sh

          python3 scripts/package-artifacts.py collect --target "$TARGET" \
            --destination "$GITHUB_WORKSPACE/.package-deliverables/session/$TARGET" \
            --name-prefix "anland-session-$TARGET-" "$GITHUB_WORKSPACE/out/$TARGET"
      - name: 上传验证包
        uses: actions/upload-artifact@v6
        with:
          name: anland-session-${{ matrix.target }}-arm64
          path: .package-deliverables/session/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 1
  release-session:
    name: 更新 Anland Next session 滚动发布
    needs: [prepare-session, build-session]
    if: ${{ always() && !cancelled() && needs.prepare-session.result == 'success' }}
    runs-on: ubuntu-26.04
    # 固定发布会被原地重写，必须串行更新。三条流水线各自独立分组，
    # 因此 session 的发布排队时不会阻塞 KDE 与 GNOME 的发布。
    concurrency:
      group: anland-session-package-release
      cancel-in-progress: false
    steps:
      - name: 检出发布脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 确保滚动标签存在
        shell: bash
        run: |
          set -euo pipefail
          tag="anland-session-packages"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已存在。"
          elif git tag "$tag" "$GITHUB_SHA" && \
              git push origin "refs/tags/${tag}"; then
            echo "已创建滚动标签 ${tag}。"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "滚动标签 ${tag} 已由并发任务创建。"
          else
            echo "无法确认或创建滚动标签 ${tag}。" >&2
            exit 1
          fi

      - name: 下载构建包
        if: ${{ always() }}
        uses: actions/download-artifact@v7
        with:
          pattern: anland-session-*-arm64
          path: release-assets
          merge-multiple: false

      - name: 创建固定发布与软件包清单
        env:
          GH_TOKEN: ${{ github.token }}
          ANLAND_REPO: ${{ inputs.session_repo || 'https://github.com/SuperTurtleDev/anland.git' }}
          ANLAND_REF: ${{ inputs.session_ref || 'main' }}
          ANLAND_COMMIT: ${{ needs.prepare-session.outputs.anland_commit }}
          BUILD_TARGET_INPUT: ${{ inputs.session_target || 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$release_dir"
          rolling_release_tag="anland-session-packages"
          release_targets=(ubuntu2604 debian13 fedora43 fedora44 arch)
          declare -A asset_by_target=()
          declare -A asset_time_by_target=()
          declare -A asset_source_by_target=()
          updated_targets=()
          reused_targets=()
          build_time="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          asset_prefix_for_target() {
            printf 'anland-session-%s-' "$1"
          }

          target_label() {
            case "$1" in
              ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
              debian13) printf '%s\n' 'Debian 13' ;;
              fedora43) printf '%s\n' 'Fedora 43' ;;
              fedora44) printf '%s\n' 'Fedora 44' ;;
              arch) printf '%s\n' 'Arch Linux' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          archive_target_for_target() {
            printf '%s\n' "$1"
          }

          local_asset_for_target() {
            local target="$1"
            local prefix path
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            while IFS= read -r path; do
              candidates+=("${path##*/}")
            done < <(find "$release_dir" -maxdepth 1 -type f -name "${prefix}*" -print | sort)
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "资产前缀 ${prefix} 在本次构建中应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 0 ]; then
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          release_assets_tag=""
          release_assets=""
          load_release_assets() {
            local tag="$1"
            if [ "$release_assets_tag" = "$tag" ]; then
              return 0
            fi
            if ! release_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"; then
              return 1
            fi
            release_assets_tag="$tag"
          }

          release_asset_for_target() {
            local tag="$1"
            local target="$2"
            local prefix name
            local -a candidates=()
            prefix="$(asset_prefix_for_target "$target")"
            load_release_assets "$tag" || return 1
            while IFS= read -r name; do
              case "$name" in
                "${prefix}"*) candidates+=("$name") ;;
              esac
            done <<< "$release_assets"
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "发布 ${tag} 中资产前缀 ${prefix} 应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 2
            elif [ "${#candidates[@]}" -eq 1 ]; then
              printf '%s\n' "${candidates[0]}"
              return 0
            fi
            return 1
          }

          previous_tag=""
          previous_release_time=""
          find_previous_release() {
            local stable_candidate

            stable_candidate="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null)" || return 1
            [ "$stable_candidate" = "$rolling_release_tag" ] || return 1
            release_assets_tag=""
            load_release_assets "$rolling_release_tag" || return 1
            previous_tag="$rolling_release_tag"
            previous_release_time="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$rolling_release_tag" \
              --jq '.published_at // empty' 2>/dev/null)" || return 1
            return 0
          }

          case "$BUILD_TARGET_INPUT" in
            all) selected_target="" ;;
            ubuntu2604|debian13|fedora43|fedora44|arch) selected_target="$BUILD_TARGET_INPUT" ;;
            *) echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2; exit 1 ;;
          esac

          # Route only package files; no build manifest is transported as an Artifact.
          missing_targets=()
          for target in "${release_targets[@]}"; do
            artifact_dir="$release_dir/anland-session-${target}-arm64"
            [ -d "$artifact_dir" ] || artifact_dir="$release_dir"
            shopt -s nullglob
            candidates=()
            for package in "$artifact_dir"/anland-session-"$target"-*; do
              case "$target:${package##*/}" in
                ubuntu2604:*.deb|debian13:*.deb|fedora43:*.rpm|fedora44:*.rpm|arch:*.pkg.tar.zst)
                  [[ -f "$package" && ! -L "$package" && -s "$package" ]] || exit 1
                  candidates+=("$package") ;;
              esac
            done
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo "Multiple session packages for $target" >&2; exit 1
            elif [ "${#candidates[@]}" -eq 1 ]; then
              package="${candidates[0]}"
              asset="${package##*/}"
              [ "$package" = "$release_dir/$asset" ] || cp -p "$package" "$release_dir/$asset"
              asset_by_target["$target"]="$asset"
              asset_time_by_target["$target"]="$build_time"
              asset_source_by_target["$target"]='本次构建'
              updated_targets+=("$target")
            else
              missing_targets+=("$target")
            fi
          done

          # 单平台选择失败时不更新滚动发布；其他平台始终从固定发布补齐。
          if [ -n "$selected_target" ]; then
            selected_missing=false
            for target in "${missing_targets[@]}"; do
              if [ "$target" = "$selected_target" ]; then
                selected_missing=true
                break
              fi
            done
            if [ "$selected_missing" = true ]; then
              echo "选择的 ${selected_target} 构建没有生成新资产，本次不更新滚动发布。" >&2
              exit 1
            fi
          fi

          # 固定发布里有的平台就沿用，没有的平台本次先缺着，后续再补齐。
          unavailable_targets=()
          if [ "${#missing_targets[@]}" -gt 0 ]; then
            previous_dir="$RUNNER_TEMP/anland-session-previous-assets"
            rm -rf "$previous_dir"
            mkdir -p "$previous_dir"
            find_previous_release || echo "固定发布还不存在或不可读，本次只发布已构建的平台。"

            for target in "${missing_targets[@]}"; do
              asset=""
              if [ -n "$previous_tag" ]; then
                if asset="$(release_asset_for_target "$previous_tag" "$target")"; then
                  :
                else
                  asset_status=$?
                  [ "$asset_status" -eq 1 ] || exit "$asset_status"
                  asset=""
                fi
              fi
              if [ -z "$asset" ]; then
                unavailable_targets+=("$target")
                continue
              fi
              gh release download "$previous_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir "$previous_dir"
              cp -f "$previous_dir/$asset" "$release_dir/$asset"
              asset_by_target["$target"]="$asset"
              asset_time_by_target["$target"]="${previous_release_time:-未知}（沿用）"
              asset_source_by_target["$target"]="沿用 ${previous_tag}"
              reused_targets+=("$target")
            done
          fi

          if [ "${#updated_targets[@]}" -eq 0 ]; then
            echo "本次没有任何平台生成新资产，不更新滚动发布。" >&2
            exit 1
          fi

          if [ "${#unavailable_targets[@]}" -gt 0 ]; then
            echo "以下平台本次发布暂无软件包，等待后续构建补齐：${unavailable_targets[*]}"
          fi

          present_targets=()
          release_package_names=()
          for target in "${release_targets[@]}"; do
            if [ -n "${asset_by_target[$target]+set}" ]; then
              present_targets+=("$target")
              release_package_names+=("${asset_by_target[$target]}")
            fi
          done

          manifest_path="$release_dir/anland-session-manifest"
          {
            printf 'format=1\n'
            printf 'release_tag=%s\n' "$rolling_release_tag"
            printf 'revision=run-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'generated_at=%s\n' "$build_time"
            printf 'source_repository=%s\n' "$ANLAND_REPO"
            printf 'source_ref=%s\n' "$ANLAND_REF"
            printf 'source_commit=%s\n' "$ANLAND_COMMIT"
            for target in "${present_targets[@]}"; do
              printf '%s=%s\n' "$(archive_target_for_target "$target")" "${asset_by_target[$target]}"
            done
          } > "$manifest_path"
          release_package_names+=("anland-session-manifest")
          (
            cd "$release_dir"
            sha256sum "${release_package_names[@]}" > SHA256SUMS
          )

          format_target_list() {
            local target text=""
            for target in "$@"; do
              text="${text}${text:+、}$(target_label "$target")"
            done
            printf '%s\n' "${text:-无}"
          }

          updated_target_list="$(format_target_list "${updated_targets[@]}")"
          reused_target_list="$(format_target_list "${reused_targets[@]}")"
          unavailable_target_list="$(format_target_list "${unavailable_targets[@]}")"
          if [ "${#reused_targets[@]}" -eq 0 ] && [ "${#unavailable_targets[@]}" -eq 0 ]; then
            replacement_note='本次构建重新生成全部五个平台的软件包。'
          else
            replacement_note="本次替换：${updated_target_list}"
            if [ "${#reused_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；沿用 ${previous_tag}：${reused_target_list}"
            fi
            if [ "${#unavailable_targets[@]}" -gt 0 ]; then
              replacement_note="${replacement_note}；本次发布暂无：${unavailable_target_list}"
            fi
            replacement_note="${replacement_note}。"
          fi

          release_asset_table="$(printf '%s\n' \
            '| 软件包 | 目标系统 | 构建时间 |' \
            '| --- | --- | --- |')"
          for target in "${present_targets[@]}"; do
            asset="${asset_by_target[$target]}"
            asset_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${rolling_release_tag}/${asset}"
            release_asset_table="${release_asset_table}"$'\n'"| [\`${asset}\`](${asset_url}) | $(target_label "$target") | ${asset_time_by_target[$target]} |"
          done
          release_source_list=""
          for target in "${present_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：${asset_source_by_target[$target]}"
          done
          for target in "${unavailable_targets[@]}"; do
            release_source_list="${release_source_list}"$'\n'"- $(target_label "$target")：本次发布暂无软件包，等待后续构建补齐"
          done
          release_notes="$(printf '%s\n' \
            '# Anland Next session ARM64 预编译包' \
            '' \
            '这些是供 Anland Next rootfs 使用的发行版原生软件包；安装时仍由目标发行版的 apt、dnf 或 pacman 管理。' \
            '包内含 mini-wm，以及打过补丁的 Xwayland（kgsl/turnip glamor 修复）与 bubblewrap（mountinfo 索引修复），两者装在 `/usr/lib/anland/` 并由会话的 PATH 优先解析；发行版的 Xwayland 仍作为依赖安装，作为补丁构建缺失时的兜底。' \
            '' \
            '## 发布资产' \
            '' \
            "$release_asset_table" \
            '' \
            '使用 `anland-session-manifest` 将目标系统映射到对应的软件包，使用 `SHA256SUMS` 校验下载内容。' \
            '' \
            '## 构建详情' \
            '' \
            "- 构建目标：${BUILD_TARGET_INPUT}" \
            "- ${replacement_note}" \
            "- 发布生成时间：${build_time}" \
            "- 源码：\`${ANLAND_REPO}\` @ \`${ANLAND_COMMIT}\`（请求：\`${ANLAND_REF}\`）" \
            "- 工作流提交：\`${GITHUB_SHA}\`" \
            '- 架构：仅 ARM64/aarch64' \
            '' \
            '## 资产来源' \
            "$release_source_list" \
            '')"

          release_tag="$rolling_release_tag"
          release_exists=false
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          asset_matches_target() {
            local target="$1"
            local name="$2"
            case "$name" in
              "$(asset_prefix_for_target "$target")"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          delete_stale_target_assets() {
            local target="$1"
            local desired="$2"
            local asset_rows asset_id asset_name
            asset_rows="$(gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
              --jq '.assets[] | [.id, .name] | @tsv')" || return 1
            while IFS=$'\t' read -r asset_id asset_name; do
              [ -n "$asset_id" ] || continue
              if asset_matches_target "$target" "$asset_name" && [ "$asset_name" != "$desired" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done <<< "$asset_rows"
          }

          if [ "$release_exists" = true ]; then
            updated_uploads=()
            for target in "${updated_targets[@]}"; do
              updated_uploads+=("$release_dir/${asset_by_target[$target]}")
            done
            gh release upload "$release_tag" "${updated_uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload "$release_tag" \
              "$manifest_path" "$release_dir/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            for target in "${updated_targets[@]}"; do
              delete_stale_target_assets "$target" "${asset_by_target[$target]}"
            done
            gh release edit "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Anland Next session ARM64 预编译包' \
              --notes "$release_notes" \
              --draft=false \
              --latest=false
          else
            release_uploads=()
            for target in "${present_targets[@]}"; do
              release_uploads+=("$release_dir/${asset_by_target[$target]}")
            done
            release_uploads+=("$manifest_path" "$release_dir/SHA256SUMS")
            gh release create "$release_tag" "${release_uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title 'Anland Next session ARM64 预编译包' \
              --notes "$release_notes"
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

          echo "已更新 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag"

      - name: 同步到 CNB 国内镜像
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_cnb }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: bash scripts/publish-cnb-release.sh anland-session-packages
